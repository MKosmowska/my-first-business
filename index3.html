      <div className="card-h"><h3>${L('Przychody i koszty a liczba sprzedanych jednostek', 'Revenue and costs against units sold')}</h3></div>
      <${BreakEvenChart} c=${c} />
      <p className="small muted">${L('Linie przecinają się w progu rentowności. Na lewo od niego koszty są wyższe niż przychód, na prawo przychód je przewyższa.', 'The lines cross at the break-even point. To the left, costs exceed revenue; to the right, revenue exceeds costs.')}</p>
    </div>

    <div className="card">
      <div className="card-h"><h3>${L('Struktura miesięcznych kosztów', 'Breakdown of monthly costs')}</h3></div>
      <${CostStructure} c=${c} />
    </div>
  </section>`;
}

/* ---------- ETAP 5 ---------- */
function priceCurve(st, c) {
  var ref = c.refPrice > 0 ? c.refPrice : c.price;
  var lo = Math.max(0.01, Math.min(ref * 0.5, c.price * 0.9)), hi = Math.max(ref * 2, c.price * 1.1);
  var N = 120, pts = [], best = null;
  for (var i = 0; i <= N; i++) {
    var pr = lo + (hi - lo) * i / N;
    var cc = calc(withOverrides(st, { price: decStr(Math.round(pr * 100) / 100) }), { exact: true });
    var q = { p: pr, op: cc.op, over: cc.planOver, cl: cc.clients, i: i };
    pts.push(q);
    if (cc.ok && !q.over && (best == null || q.op > best.op)) best = q;
  }
  return { pts: pts, best: best, lo: lo, hi: hi, edge: best ? (best.i === 0 ? 'lo' : best.i === N ? 'hi' : null) : null };
}

function PriceCurve(p) {
  var st = p.st, c = p.c;
  var pc = useMemo(function () { return priceCurve(st, c); }, [st, LANG]);
  var W = 720, H = 300, m = { l: 70, r: 24, t: 34, b: 46 };
  var ops = pc.pts.map(function (q) { return q.op; });
  var mn = Math.min(0, Math.min.apply(null, ops)), mx = Math.max(0, Math.max.apply(null, ops));
  var yt = ticks(mn < 0 ? -niceUp(-mn) : 0, niceUp(mx * 1.05), 5);
  var lo = yt[0], hi = yt[yt.length - 1];
  var x = function (v) { return m.l + (v - pc.lo) / (pc.hi - pc.lo) * (W - m.l - m.r); };
  var y = function (v) { return m.t + (hi - v) / (hi - lo) * (H - m.t - m.b); };
  var xt = ticks(pc.lo, pc.hi, 6).filter(function (t) { return t >= pc.lo - 1e-9 && t <= pc.hi + 1e-9; });
  var feas = pc.pts.filter(function (q) { return !q.over; }), inf = pc.pts.filter(function (q) { return q.over; });
  var line = function (arr) { return pts(arr.map(function (q) { return [x(q.p), y(q.op)]; })); };
  var b = pc.best;
  /* obecny plan, jeśli jest wykonalny, zawsze bierzemy pod uwagę jako kandydata na najlepszy wynik */
  if (c.ok && !c.planOver && (!b || c.op > b.op)) b = { p: c.price, op: c.op };
  var bestRight = b && x(b.p) > W - 220;
  var curRight = x(c.price) > W - 160;
  return html`<figure className="chart">
    <div className="legend">
      <span><i className="sw" style=${{ background: 'var(--accent)' }}></i>${L('Wynik miesięczny przy danej cenie', 'Monthly result at each price')}</span>
      ${inf.length ? html`<span><i className="sw dash"></i>${L('Za dużo klientów do obsłużenia', 'More customers than you can serve')}</span>` : null}
    </div>
    <div className="svgwrap"><svg viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label=${L('Wykres wyniku miesięcznego w zależności od ceny', 'Chart of monthly result against price')}>
      ${yt.map(function (t) { return html`<g key=${'y' + t}><line x1=${m.l} x2=${W - m.r} y1=${y(t)} y2=${y(t)} stroke=${t === 0 ? 'var(--ink)' : 'var(--line)'} strokeWidth=${t === 0 ? 1.5 : 1} /><text x=${m.l - 8} y=${y(t)} textAnchor="end" dominantBaseline="middle" className="ax">${compact(t)}</text></g>`; })}
      ${xt.map(function (t) { return html`<text key=${'x' + t} x=${x(t)} y=${H - m.b + 18} textAnchor="middle" className="ax">${num(t)}</text>`; })}
      <text x=${(m.l + W - m.r) / 2} y=${H - 6} textAnchor="middle" className="ax-t">${L('Cena jednostki (zł)', 'Unit price (PLN)')}</text>
      <text x=${14} y=${m.t - 16} className="ax-t">${L('wynik, zł', 'result, PLN')}</text>
      ${inf.length ? html`<polyline points=${line(inf)} fill="none" stroke="var(--muted)" strokeWidth="2" strokeDasharray="5 5" />` : null}
      ${feas.length > 1 ? html`<polyline points=${line(feas)} fill="none" stroke="var(--accent)" strokeWidth="2.5" />` : null}
      ${c.ok && c.price >= pc.lo && c.price <= pc.hi ? html`<g>
        <line x1=${x(c.price)} x2=${x(c.price)} y1=${m.t} y2=${H - m.b} stroke="var(--muted)" strokeWidth="1" strokeDasharray="2 3" />
        <circle cx=${x(c.price)} cy=${y(c.op)} r="5" fill="var(--ink)" stroke="var(--surface)" strokeWidth="2" />
        <text x=${curRight ? x(c.price) - 8 : x(c.price) + 8} y=${H - m.b - 8} textAnchor=${curRight ? 'end' : 'start'} className="mk plan">${L('Twoja cena', 'Your price')}</text></g>` : null}
      ${b ? html`<g>
        <circle cx=${x(b.p)} cy=${y(b.op)} r="6" fill="var(--good)" stroke="var(--surface)" strokeWidth="2" />
        <text x=${bestRight ? x(b.p) - 10 : x(b.p) + 10} y=${Math.max(y(b.op) - 10, m.t - 8)} textAnchor=${bestRight ? 'end' : 'start'} className="mk best">${L('najwyższy wynik: ', 'best result: ') + money(Math.round(b.op))}</text></g>` : null}
    </svg></div>
    ${b ? html`<div className="est">
      <p>${L('Przy Twoich założeniach najwyższy wynik, ok. ' + money(Math.round(b.op)) + ', daje cena około ' + money(Math.round(b.p)) + '. Teraz: ' + money(c.price) + ' i wynik ' + money(c.op) + '.', 'Under your assumptions the best result, about ' + money(Math.round(b.op)) + ', comes at a price of about ' + money(Math.round(b.p)) + '. Now: ' + money(c.price) + ' and a result of ' + money(c.op) + '.')}</p>
      ${Math.abs(Math.round(b.p) - c.price) >= 1 ? html`<button type="button" className="btn btn-ghost" onClick=${function () { p.set(['sales', 'price'], String(Math.round(b.p))); }}>${L('Ustaw cenę ' + money(Math.round(b.p)), 'Set price to ' + money(Math.round(b.p)))}</button>` : null}
    </div>` : html`<p className="hint">${L('Przy żadnej cenie z tego zakresu nie da się obsłużyć wszystkich klientów albo brakuje danych.', 'No price in this range lets you serve all customers, or some data is missing.')}</p>`}
    ${pc.edge === 'hi' ? html`<p className="small muted">${L('Wynik rośnie aż do prawego brzegu wykresu. Przy tak słabej reakcji klientów model każe ciągle podnosić cenę. W rzeczywistości przy dużych podwyżkach klienci odchodzą szybciej, więc wpisz większą utratę klientów albo nie ufaj wynikom daleko od obecnej ceny.', 'The result keeps rising to the right edge of the chart. With such a weak customer reaction the model keeps telling you to raise the price. In reality customers leave faster after big rises, so enter a larger customer loss or do not trust results far from your current price.')}</p>` : null}
    ${pc.edge === 'lo' ? html`<p className="small muted">${L('Wynik rośnie aż do lewego brzegu wykresu, czyli model każe mocno obniżać cenę. Sprawdź, czy założona utrata klientów nie jest za duża.', 'The result keeps rising to the left edge of the chart, so the model says to cut the price sharply. Check whether the customer loss you assumed is too large.')}</p>` : null}
    <div className="explain-own">
      <p className="explain-h">${L('Jak czytać ten wykres', 'How to read this chart')}</p>
      <p>${L('Włączona jest reakcja klientów na cenę: przy podwyżce o 10% tracisz ' + num(c.loss, 1) + '% klientów (elastyczność ' + num(c.elast, 2) + '). Każda podwyżka daje więcej zarobku na jednej sprzedaży, ale odbiera część klientów. Dlatego wynik nie rośnie bez końca: szczyt krzywej to cena, przy której oba efekty się równoważą.',
        'Customer reaction to price is on: a 10% price rise loses ' + num(c.loss, 1) + '% of customers (elasticity ' + num(c.elast, 2) + '). Each rise earns more per sale but drives some customers away. That is why the result does not grow forever: the top of the curve is the price where the two effects balance.')}</p>
      ${c.elast > 1 ? html`<p>${L('Elastyczność powyżej 1 oznacza, że przy podwyżce klientów ubywa szybciej, niż rośnie cena. Przychód spada, więc na prawo od szczytu wynik maleje.', 'Elasticity above 1 means customers leave faster than the price rises. Revenue falls, so to the right of the peak the result goes down.')}</p>` : null}
      ${c.planOver ? html`<p>${L('Przy Twojej obecnej cenie przyszłoby więcej klientów, niż zdołasz obsłużyć, więc obecny wynik (' + money(c.op) + ') jest tylko na papierze. Takie ceny pokazuje linia przerywana. Najwyższy wynik liczymy tylko dla cen, przy których obsłużysz wszystkich klientów.', 'At your current price more customers would come than you can serve, so your current result (' + money(c.op) + ') exists only on paper. The dashed line shows such prices. The best result only counts prices at which you can serve everyone.')}</p>` : null}
      ${b && c.target > 0 && b.op < c.target ? html`<p>${L('Nawet najlepsza cena daje mniej niż Twój cel (' + money(c.target) + '). Żeby go osiągnąć, trzeba zmienić inne założenia: obniżyć koszty stałe, zwiększyć zespół albo sprawić, by klienci mniej reagowali na cenę, np. lepszą ofertą.', 'Even the best price earns less than your target (' + money(c.target) + '). To reach it, change other assumptions: lower fixed costs, a bigger team, or customers who react less to price, e.g. thanks to a better offer.')}</p>` : null}
    </div>
    <figcaption className="small muted">${L('Model zakłada stałą elastyczność: każda podwyżka o 10% odbiera tę samą część klientów. To rozsądne przybliżenie dla niewielkich zmian ceny, mniej dokładne dla dużych.', 'The model assumes constant elasticity: every 10% rise loses the same share of customers. That is a fair approximation for small price changes and less accurate for large ones.')}</figcaption>
  </figure>`;
}

var EXP_FIELDS = [
  { k: 'price', path: ['sales', 'price'], label: ['Cena jednostki', 'Unit price'], money: true, floor: 50, step: 1 },
  { k: 'clients', path: ['sales', 'clients'], label: ['Liczba klientów', 'Number of customers'], suffix: ['os.', 'ppl'], floor: 50, step: 1 },
  { k: 'materials', path: ['variable', 'materials'], label: ['Koszt materiałów na jednostkę', 'Materials cost per unit'], money: true, floor: 20, step: 0.5 },
  { k: 'rent', path: ['fixed', 'rent'], label: ['Najem', 'Rent'], money: true, floor: 2000, step: 50 },
  { k: 'employee', path: ['fixed', 'employee'], label: ['Koszt jednego pracownika', 'Cost per employee'], money: true, floor: 8000, step: 100 }
];
function snapRef(s) { var r = {}; EXP_FIELDS.forEach(function (f) { r[f.k] = getIn(s, f.path) || ''; }); r.op = calc(s).op; return r; }

function SliderRow(p) {
  var f = p.f, st = p.st, v = parseNum(getIn(st, f.path)).v;
  var refV = parseNum(p.refRaw).v;
  var max = niceUp(Math.max(refV * 2, f.floor, v));
  var id = 'sl-' + f.k;
  var fmt = function (x) { return f.money ? money(x) : num(x) + ' ' + L(f.suffix[0], f.suffix[1]); };
  return html`<div className=${'slider' + (p.disabled ? ' is-off' : '')}>
    <div className="slider-top"><label htmlFor=${id}>${L(f.label[0], f.label[1])}</label><output htmlFor=${id} className="num">${fmt(v)}</output></div>
    <input id=${id} type="range" min="0" max=${max} step=${f.step} value=${Math.min(v, max)} disabled=${!!p.disabled}
      onChange=${function (e) { p.set(f.path, decStr(e.target.value)); }} />
    <div className="slider-scale small muted"><span>0</span><span>start: ${f.money ? money(refV) : num(refV)}</span><span>${num(max)}</span></div>

var TASKS = [

      }

    } },
  { id: 'q2', q: ['Ile dodatkowej sprzedaży potrzeba po obniżeniu ceny o 10%, aby zachować wynik?', 'How many extra sales do you need after a 10% price cut to keep the same result?'],
    general: [['Liczymy, ile jednostek trzeba sprzedać przy nowej marży, aby łączna marża (sprzedaż × marża na jednostce) była taka sama jak teraz. Koszty stałe się nie zmieniają.'],
      ['We calculate how many units you need to sell at the new margin so that total contribution (sales × margin per unit) stays the same as now. Fixed costs do not change.']],

      if (c.cm <= 0) return [L('Twoja obecna marża jest niedodatnia, więc najpierw trzeba ją poprawić.', 'Your current margin is zero or negative, so you need to fix that first.')];

  { id: 'q3', q: ['Co się stanie, gdy materiały zdrożeją o 20%?', 'What happens if materials get 20% more expensive?'],

    own: function (c) {

      if (cm3 > 0 && c.upc > 0) { var be3 = c.fixedTotal === 0 ? 0 : ceilS(c.fixedTotal / cm3); out.push(L('Klienci do progu: ', 'Customers to break even: ') + (c.beClients != null ? num(c.beClients) : '—') + ' → ' + num(ceilS(be3 / c.upc)) + '.'); }

function TaskCard(p) {

function StageExp(p) {

  var ref = st.expRef || snapRef(st);
  var delta = c.ok ? c.op - ref.op : null;
  function restore() { setSt(function (s) { var n = s; EXP_FIELDS.forEach(function (f) { n = setIn(n, f.path, ref[f.k]); }); return n; }); }

      <p className="lede">${L('Przesuwaj suwaki i patrz, jak zmienia się wynik. Suwaki zmieniają Twoje dane z etapu 3. Zawsze możesz wrócić do punktu startowego.', 'Move the sliders and watch the result change. The sliders change your data from step 3. You can always go back to the starting point.')}</p></header>

    <div className="card">

          <p className="hint">${st.demand.on ? L('Zmiana ceny zmienia liczbę klientów według Twojego założenia z etapu 3. Suwak „Liczba klientów” ustawia liczbę klientów przy cenie odniesienia (' + money(c.refPrice) + ').', 'Changing the price changes the number of customers according to your assumption from step 3. The “Number of customers” slider sets customers at the reference price (' + money(c.refPrice) + ').') : L('Zmiana ceny nie zmienia tu liczby klientów. Ten suwak ustawiasz sam, jako swoje założenie. Jeśli chcesz, żeby klienci reagowali na cenę, włącz to w etapie 3.', 'Changing the price does not change the number of customers here. You set that slider yourself, as your own assumption. To make customers react to price, turn it on in step 3.')}</p>

                onChange=${function (ev) { set(['scen', s.id, row[0]], ev.target.value); }} /><span className="suffix">${row[2]}</span></div>${e ? html`<div className="err">${e}</div>` : null}</td>`;
            })}</tr>`;
          })}
          <tr className="sep"><th scope="row">${L('Przychód', 'Revenue')}</th>${scen.map(function (s) { return html`<td key=${s.id} className="num">${s.c.ok ? money(s.c.revenue) : '—'}</td>`; })}</tr>

      ${c.demandOn ? row(L('Klienci przy cenie odniesienia ', 'Customers at reference price ') + money(c.refPrice), num(c.clients0)) : null}
      ${c.demandOn ? row(L('Utrata klientów przy +10% ceny', 'Customers lost at +10% price'), num(c.loss, 1) + '% (' + L('elastyczność ', 'elasticity ') + num(c.elast, 2) + ')') : null}
      ${row(L('Klienci przy obecnej cenie', 'Customers at current price'), num(c.clients, c.demandOn ? 1 : 0))}
      ${c.fixedItems.filter(function (i) { return i.v > 0; }).map(function (i) { return row(i.l, money(i.v)); })}

      ${row(L('Limit obsługi', 'Capacity'), c.capacity == null ? '—' : num(c.capacity) + ' ' + uLabel(c, c.capacity))}
      ${row(L('Cel dla właściciela', "Owner's target"), money(c.target))}
      ${row(L('Inwestycja na start', 'Start-up investment'), money(c.inv))}
      ${st.idea.area && AREA_BY_CODE[st.idea.area] ? row(L('Gmina lub dzielnica', 'Municipality or district'), AREA_BY_CODE[st.idea.area][1] + ', ' + num(AREA_BY_CODE[st.idea.area][3], 1) + L(' os./km², płace w powiecie ', ' people/km², county pay ') + num((areaPow(AREA_BY_CODE[st.idea.area]) || [0, 0, 0])[2], 1) + L('% średniej (GUS 2025)', '% of average (GUS 2025)')) : null}
      ${ms && ms.ok ? row(L('Szacunek rynku (etap 2)', 'Market estimate (step 2)'), L('ok. ', 'about ') + num(ms.est) + ' ' + L('klientów', 'customers')) : null}
    </tbody></table></div>
    ${c.ok ? html`<div className="pr-block"><h2>${L('Wyniki', 'Results')}</h2><table><tbody>
      ${row(L('Przychód', 'Revenue'), money(c.revenue))}
      ${row(L('Koszty zmienne', 'Variable costs'), money(c.varTotal))}
      ${row(L('Koszty stałe', 'Fixed costs'), money(c.fixedTotal))}
      ${row(L('Wynik operacyjny (przed podatkiem)', 'Operating result (before tax)'), money(c.op))}
      ${row(L('Marża pokrycia na jednostce', 'Contribution margin per unit'), money(c.cm))}
      ${row(L('Klienci do progu rentowności', 'Customers to break even'), c.beClients == null ? L('nieosiągalny', 'not achievable') : num(c.beClients))}
      ${row(L('Klienci do celu', 'Customers to reach target'), c.goalClients == null ? L('nieosiągalny', 'not achievable') : num(c.goalClients))}
      ${row(L('Wykorzystanie możliwości obsługi', 'Capacity used'), utilText(c))}
      ${row(L('Orientacyjny zwrot inwestycji', 'Approximate payback'), c.payback == null ? '—' : num(c.payback, 1) + L(' mies.', ' months'))}
    </tbody></table></div>
    <div className="pr-block"><h2>${L('Próg rentowności', 'Break-even')}</h2><${BreakEvenChart} c=${c} /></div>
    <div className="pr-block"><h2>${L('Scenariusze', 'Scenarios')}</h2><table><tbody>
      <tr><th></th>${scen.map(function (s) { return html`<th key=${s.id} className="r">${s.name}</th>`; })}</tr>
      <tr><td>${L('Przychód', 'Revenue')}</td>${scen.map(function (s) { return html`<td key=${s.id} className="r">${s.c.ok ? money(s.c.revenue) : '—'}</td>`; })}</tr>
      <tr><td>${L('Wynik', 'Result')}</td>${scen.map(function (s) { return html`<td key=${s.id} className="r">${s.c.ok ? money(s.c.op) : '—'}</td>`; })}</tr>

/* ---------- Udostępnianie ---------- */
function SharePanel(p) {
  var code = useMemo(function () { return encodePlan(p.st); }, [p.st]);
  var link = STANDALONE ? (location.href.split('#')[0] + '#s=' + code) : '';
  var msgS = useState(null), msg = msgS[0], setMsg = msgS[1];
  var impS = useState(''), imp = impS[0], setImp = impS[1];
  var errS = useState(null), err = errS[0], setErr = errS[1];
  function copy(text, id) {
    function fallback() { try { var el = document.getElementById(id); el.focus(); el.select(); } catch (e) {} setMsg({ bad: true, t: L('Nie udało się skopiować. Tekst jest zaznaczony, naciśnij Ctrl+C (na Macu Cmd+C).', 'Copying failed. The text is selected, press Ctrl+C (Cmd+C on a Mac).') }); }
    try { navigator.clipboard.writeText(text).then(function () { setMsg({ t: L('Skopiowano.', 'Copied.') }); }, fallback); } catch (e) { fallback(); }
  }
  function doImport() {
    var s = decodePlan(imp);
    if (!s) { setErr(L('To nie wygląda na kod planu. Kod zaczyna się od „MPB1.”. Wklej go w całości.', 'This does not look like a plan code. A code starts with “MPB1.”. Paste it in full.')); return; }
    setErr(null); p.onImport(s);
  }
  return html`<div className="confirm share" role="dialog" aria-label=${L('Udostępnij plan', 'Share plan')}>
    <div className="share-col">
      <h3>${L('Wyślij swój plan', 'Send your plan')}</h3>
      <p className="small muted">${L('Skopiuj kod i wyślij go, np. nauczycielowi. Po wklejeniu kodu w polu obok zobaczy wszystkie Twoje liczby i odpowiedzi.', 'Copy the code and send it, for example to your teacher. After pasting it into the box next to this one, they will see all your numbers and answers.')}</p>
      <label htmlFor="share-code">${L('Kod planu', 'Plan code')}</label>
      <textarea id="share-code" readOnly rows="3" value=${code} onFocus=${function (e) { e.target.select(); }}></textarea>
      ${STANDALONE ? html`<label htmlFor="share-link">${L('Link do planu', 'Link to the plan')}</label><input id="share-link" readOnly value=${link} onFocus=${function (e) { e.target.select(); }} />` : null}
      <div className="btns">
        <button type="button" className="btn btn-primary" onClick=${function () { copy(code, 'share-code'); }}>${L('Kopiuj kod', 'Copy code')}</button>
        ${STANDALONE ? html`<button type="button" className="btn btn-ghost" onClick=${function () { copy(link, 'share-link'); }}>${L('Kopiuj link', 'Copy link')}</button>
          <button type="button" className="btn btn-ghost" onClick=${function () { try { window.print(); } catch (e) {} }}>${L('Drukuj lub zapisz PDF', 'Print or save as PDF')}</button>` : null}
      </div>
      ${msg ? html`<p className=${'status' + (msg.bad ? ' bad' : '')} role="status">${msg.t}</p>` : null}
      ${!STANDALONE ? html`<p className="hint">${L('Link do planu i drukowanie działają, gdy strona jest opublikowana pod własnym adresem. Tutaj użyj kodu.', 'The plan link and printing work when the page is published at its own address. Here, use the code.')}</p>` : null}
    </div>
    <div className="share-col">
      <h3>${L('Otwórz czyjś plan', "Open someone's plan")}</h3>
      <label htmlFor="import-code">${L('Wklej kod planu', 'Paste a plan code')}</label>
      <textarea id="import-code" rows="3" value=${imp} onChange=${function (e) { setImp(e.target.value); setErr(null); }}></textarea>
      ${err ? html`<p className="err">${err}</p>` : null}
      <div className="btns"><button type="button" className="btn btn-ghost" onClick=${doImport}>${L('Otwórz plan', 'Open plan')}</button><button type="button" className="btn btn-text" onClick=${p.onClose}>${L('Zamknij', 'Close')}</button></div>
      <p className="small muted">${L('Twój obecny plan zostanie zapamiętany i będzie można do niego wrócić.', 'Your current plan will be kept so you can go back to it.')}</p>
    </div>
  </div>`;
}

/* ---------- App ---------- */
function stepFromHash() { try { var h = (location.hash || '').slice(1); var i = STEPS.findIndex(function (s) { return s.id === h; }); return i < 0 ? 0 : i; } catch (e) { return 0; } }

function App() {
  var langS = useState(loadLang), lang = langS[0], setLangS = langS[1];
  setLang(lang);
  var boot = useState(function () {
    var saved = loadState(), fromLink = null;
    try { var hsh = location.hash || ''; if (hsh.indexOf('#s=') === 0) fromLink = decodePlan(hsh.slice(3)); } catch (e) {}
    if (fromLink) {
      try { if (saved) localStorage.setItem(STORE + '-backup', JSON.stringify(saved)); history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      return { st: fromLink, notice: saved ? 'backup' : 'plain' };
    }
    return { st: saved || exampleState('fryzjer'), notice: null };
  })[0];
  var S = useState(boot.st), st = S[0], setSt = S[1];
  var noteS = useState(boot.notice), notice = noteS[0], setNotice = noteS[1];
  var stepS = useState(stepFromHash), step = stepS[0], setStep = stepS[1];
  var pend = useState(null), pending = pend[0], setPending = pend[1];
  useEffect(function () { saveState(st); }, [st]);
  useEffect(function () { saveLang(lang); try { document.documentElement.lang = lang; document.title = L('Mój pierwszy biznes', 'My First Business'); } catch (e) {} }, [lang]);
  useEffect(function () { try { window.scrollTo(0, 0); } catch (e) {} }, [step]);
  var set = function (path, v) { setSt(function (s) { return setIn(s, path, v); }); };
  /* zmiany w etapach 1–3 ustawiają nowy punkt startowy suwaków w etapie 5 */
  var setMain = function (path, v) { setSt(function (s) { var n = setIn(s, path, v); return n.expRef ? Object.assign({}, n, { expRef: null }) : n; }); };
  var toggleDemand = function (v) {
    setSt(function (s) {
      var n = setIn(s, ['demand', 'on'], v);
      if (v && !String(s.demand.refPrice || '').trim()) n = setIn(n, ['demand', 'refPrice'], s.sales.price);
      if (v && !String(s.demand.loss || '').trim()) n = setIn(n, ['demand', 'loss'], '15');
      return Object.assign({}, n, { expRef: null });
    });
  };
  function pickArea(a) {
    setSt(function (s) {
      var n = setIn(s, ['idea', 'area'], a[0]);
      n = setIn(n, ['market', 'size', 'density'], decStr(a[3]));
      n = setIn(n, ['market', 'size', 'pop'], '');
      if (!String(s.idea.city || '').trim() || /fikcyjn|fictional/i.test(s.idea.city)) n = setIn(n, ['idea', 'city'], a[2] === 8 ? 'Warszawa' : a[1]);
      return Object.assign({}, n, { expRef: null });
    });
  }
  function importPlan(s) {
    try { localStorage.setItem(STORE + '-backup', JSON.stringify(st)); } catch (e) {}
    setSt(s); setNotice('backup'); setPending(null); setStep(0);
  }
  function restoreBackup() {
    try { var r = localStorage.getItem(STORE + '-backup'); var b = r && JSON.parse(r); if (b && b.v === 1) setSt(mergeDeep(deepClone(BLANK), b)); } catch (e) {}
    setNotice(null);
  }
  var c = useMemo(function () { return calc(st); }, [st, lang]);
  var ms = useMemo(function () { return marketSize(st); }, [st, lang]);
  function askExample(id) { setPending({ kind: 'example', id: id }); }
  function confirm() {
    if (pending.kind === 'reset') { setSt(blankState()); setStep(0); }
    else if (pending.kind === 'example') setSt(exampleState(pending.id));
    setPending(null);
  }
  var goCosts = function () { setStep(2); };
  var stages = [
    html`<${StageIdea} st=${st} set=${setMain} askExample=${askExample} pickArea=${pickArea} />`,
    html`<${StageMarket} st=${st} set=${setMain} ms=${ms} apply=${function (fn) { setSt(function (s) { var n = fn(s); return n.expRef ? Object.assign({}, n, { expRef: null }) : n; }); }} />`,
    html`<${StageCosts} st=${st} set=${setMain} c=${c} ms=${ms} toggleDemand=${toggleDemand} area=${st.idea.area ? AREA_BY_CODE[st.idea.area] : null} />`,
    html`<${StageResults} st=${st} c=${c} goCosts=${goCosts} />`,
    html`<${StageExp} st=${st} set=${set} setSt=${setSt} c=${c} goCosts=${goCosts} toggleDemand=${toggleDemand} />`
  ];
  var showMini = step === 1 || step === 2;
  var pendEx = pending && pending.kind === 'example' ? findExample(pending.id) : null;
  var curEx = st.example ? findExample(st.example) : null;

  return html`<${React.Fragment}><div className="app">
    <header className="top">
      <div className="brand">
        <p className="brand-k">${L('symulator dla uczniów i studentów', 'a simulator for students')}</p>
        <h1>${L('Mój pierwszy biznes', 'My First Business')}</h1>
      </div>
      <div className="top-actions">
        <div className="lang" role="radiogroup" aria-label="Język / Language">
          <button type="button" role="radio" aria-checked=${lang === 'pl'} className=${lang === 'pl' ? 'on' : ''} lang="pl" title="Polski" onClick=${function () { if (lang !== 'pl') { setLangS('pl'); setSt(function (s) { return relangState(s, 'pl'); }); } }}>PL</button>
          <button type="button" role="radio" aria-checked=${lang === 'en'} className=${lang === 'en' ? 'on' : ''} lang="en" title="English" onClick=${function () { if (lang !== 'en') { setLangS('en'); setSt(function (s) { return relangState(s, 'en'); }); } }}>EN</button>
        </div>
        <button type="button" className="btn btn-ghost" onClick=${function () { setPending(pending && pending.kind === 'pick' ? null : { kind: 'pick' }); }} aria-expanded=${!!pending && pending.kind === 'pick'}>${L('Wczytaj przykład', 'Load example')}</button>
        <button type="button" className="btn btn-ghost" onClick=${function () { setPending(pending && pending.kind === 'share' ? null : { kind: 'share' }); }} aria-expanded=${!!pending && pending.kind === 'share'}>${L('Udostępnij plan', 'Share plan')}</button>
        <button type="button" className="btn btn-ghost danger" onClick=${function () { setPending({ kind: 'reset' }); }}>${L('Zacznij od nowa', 'Start over')}</button>
      </div>

    ${notice ? html`<div className="linkbar" role="status"><span>${L('Otwarto przesłany plan.', 'A shared plan has been opened.')}${notice === 'backup' ? L(' Twój poprzedni plan jest zapamiętany.', ' Your previous plan has been kept.') : ''}</span>
      ${notice === 'backup' ? html`<button type="button" className="btn btn-ghost" onClick=${restoreBackup}>${L('Wróć do mojego planu', 'Go back to my plan')}</button>` : null}
      <button type="button" className="btn btn-text" onClick=${function () { setNotice(null); }}>${L('Zamknij', 'Close')}</button></div>` : null}

    ${pending && pending.kind === 'share' ? html`<${SharePanel} st=${st} onImport=${importPlan} onClose=${function () { setPending(null); }} />` : null}
    ${pending && pending.kind !== 'share' ? html`<div className="confirm" role="dialog" aria-label=${L('Potwierdzenie', 'Confirmation')}>
      ${pending.kind === 'pick' ? html`<p>${L('Wybierz przykład. Zastąpi on wszystkie Twoje obecne dane fikcyjnymi założeniami.', 'Choose an example. It will replace all your current data with fictional assumptions.')}</p>
        <div className="btns">${EXAMPLES.map(function (e) { return html`<button key=${e.id} type="button" className="btn btn-ghost" onClick=${function () { setSt(exampleState(e.id)); setPending(null); }}>${exName(e)}</button>`; })}
        <button type="button" className="btn btn-text" onClick=${function () { setPending(null); }}>${L('Anuluj', 'Cancel')}</button></div>`
      : html`<p>${pending.kind === 'reset' ? L('Wyczyścić wszystkie pola i zacząć od pustego formularza? Tego nie da się cofnąć.', 'Clear every field and start with an empty form? This cannot be undone.') : L('Wczytać przykład „' + exName(pendEx) + '”? Zastąpi on wszystkie Twoje obecne dane.', 'Load the “' + exName(pendEx) + '” example? It will replace all your current data.')}</p>
        <div className="btns"><button type="button" className="btn btn-primary" onClick=${confirm}>${pending.kind === 'reset' ? L('Tak, wyczyść', 'Yes, clear') : L('Tak, wczytaj', 'Yes, load')}</button><button type="button" className="btn btn-text" onClick=${function () { setPending(null); }}>${L('Anuluj', 'Cancel')}</button></div>`}
    </div>` : null}


    <nav className="stepper" aria-label=${L('Etapy', 'Steps')}>
      <ol>${STEPS.map(function (s, i) {
        return html`<li key=${s.id}><button type="button" className=${(i === step ? 'cur' : '') + (i < step ? ' done' : '')} aria-current=${i === step ? 'step' : null} onClick=${function () { setStep(i); }}>
          <span className="st-n num">${i + 1}</span><span className="st-t">${stepName(s)}</span></button></li>`;
      })}</ol>
    </nav>
    ${(function () {
      var ar = st.idea.area ? AREA_BY_CODE[st.idea.area] : null, mk = st.market, isLocal = st.idea.model === 'lokalny';
      var osmOn = isLocal && mk.mode !== 'demo' && mk.osm && (mk.osm.packed || mk.items.some(function (x) { return x.src === 'osm'; }));
      var real = [], fake = [];
      if (ar) real.push(L('gmina ' + ar[1] + ' (gęstość zaludnienia, płace oraz wiek i płeć mieszkańców powiatu, GUS 2025)', ar[1] + ' (population density, county pay, and age and sex of residents, GUS 2025)'));
      if (osmOn) real.push(L('konkurencja z OpenStreetMap (' + mk.osm.date + ')', 'competitors from OpenStreetMap (' + mk.osm.date + ')'));

      return html`<p className="exnote" role="note"><b>${L('Prawdziwe dane: ', 'Real data: ')}</b>${real.length ? real.join('; ') + '.' : L('jeszcze brak. Wybierz gminę w etapie 1 i wyszukaj konkurencję w etapie 2.', 'none yet. Choose your municipality in step 1 and search for competitors in step 2.')}

  </div>
  <${PrintReport} st=${st} c=${c} ms=${ms} /><//>`;
}

/* Granica błędów: gdy coś wysypie się podczas działania, zamiast białej strony pokazujemy komunikat i przycisk czyszczenia danych */
function Boundary(props) { React.Component.call(this, props); this.state = { err: null }; }
Boundary.prototype = Object.create(React.Component.prototype);
Boundary.prototype.constructor = Boundary;
Boundary.getDerivedStateFromError = function (err) { return { err: err }; };
Boundary.prototype.render = function () {
  var err = this.state.err;
  if (!err) return this.props.children;
  return html`<div className="crash" role="alert">
    <h2>${L('Coś poszło nie tak', 'Something went wrong')}</h2>
    <p>${L('Komunikat błędu (zrób zrzut ekranu i wyślij autorce):', 'Error message (take a screenshot and send it to the author):')}</p>
    <pre>${String((err && (err.stack || err.message)) || err)}</pre>
    <div className="btns"><button type="button" className="btn btn-primary" onClick=${function () { try { localStorage.removeItem(STORE); } catch (e) {} location.reload(); }}>${L('Wyczyść zapisane dane i odśwież', 'Clear saved data and reload')}</button>
      <button type="button" className="btn btn-ghost" onClick=${function () { location.reload(); }}>${L('Odśwież stronę', 'Reload page')}</button></div>
  </div>`;
};
ReactDOM.createRoot(document.getElementById('root')).render(html`<${Boundary}><${App} /><//>`);
})();
</script>

</body></html>
