<meta property="og:title" content="Mój pierwszy biznes">

<style>
/* Układ: pasek etapów u góry, formularz w kartach + boczny podgląd na żywo; wyniki jak paragon */
:root {
  --bg: #F1F4F9; --surface: #FFFFFF; --surface-2: #E7ECF4; --ink: #121B2E; --muted: #58637C; --line: #D3DAE6;
  --accent: #2F45F5; --accent-ink: #FFFFFF; --accent-soft: #E2E6FF;
  --marker: #FFE14D; --marker-ink: #2B2300;
  --good: #0B8456; --good-soft: #DCF3E8; --bad: #C33328; --bad-soft: #FBE3E0; --warn: #A86300; --warn-soft: #FFF0D4;
  --paper: #FFFEF8; --paper-ink: #1F2330;
  --c1:#2F45F5; --c2:#0B8456; --c3:#E0712B; --c4:#A63CA0; --c5:#1696B0; --c6:#8C6B00; --c7:#D2445C; --c8:#6E7C9C; --c9:#4B3BC9; --c10:#5A9A2E; --c11:#B5502F; --c12:#2C6C8F; --c13:#9B5FD1;
  --mini-bg: #121B2E; --mini-fg: #F1F4F9; --mini-muted: #AEB8CE; --mini-line: #121B2E; --mini-good: #5FD6A1; --mini-bad: #FF9C90;
  --title-line-h: 10px; --title-line-gap: -12px; --title-line-op: .85;
  --f-display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C1120; --surface: #141B2C; --surface-2: #1C2538; --ink: #E7EBF4; --muted: #9AA5BD; --line: #2A3550;
  --accent: #8291FF; --accent-ink: #0C1120; --accent-soft: #232A5A;
  --marker: #FFE14D; --marker-ink: #2B2300;
  --good: #3FCB8F; --good-soft: #10352A; --bad: #FF7B6F; --bad-soft: #42201E; --warn: #F2B64A; --warn-soft: #3B2C10;
  --paper: #191F30; --paper-ink: #E7EBF4;
  --c1:#8291FF; --c2:#3FCB8F; --c3:#F49A5C; --c4:#D77BD1; --c5:#4CC6DE; --c6:#D9B84A; --c7:#F27D91; --c8:#9BA8C4; --c9:#A99BFF; --c10:#8BC95A; --c11:#E38C69; --c12:#6AAED3; --c13:#C49BF0;
  --mini-bg: #1C2538; --mini-fg: #E7EBF4; --mini-muted: #A3AEC6; --mini-line: #34405C;
  --title-line-h: 4px; --title-line-gap: 6px; --title-line-op: .9;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0C1120; --surface: #141B2C; --surface-2: #1C2538; --ink: #E7EBF4; --muted: #9AA5BD; --line: #2A3550;
  --accent: #8291FF; --accent-ink: #0C1120; --accent-soft: #232A5A;
  --marker: #FFE14D; --marker-ink: #2B2300;
  --good: #3FCB8F; --good-soft: #10352A; --bad: #FF7B6F; --bad-soft: #42201E; --warn: #F2B64A; --warn-soft: #3B2C10;
  --paper: #191F30; --paper-ink: #E7EBF4;
  --c1:#8291FF; --c2:#3FCB8F; --c3:#F49A5C; --c4:#D77BD1; --c5:#4CC6DE; --c6:#D9B84A; --c7:#F27D91; --c8:#9BA8C4; --c9:#A99BFF; --c10:#8BC95A; --c11:#E38C69; --c12:#6AAED3; --c13:#C49BF0;
  --mini-bg: #1C2538; --mini-fg: #E7EBF4; --mini-muted: #A3AEC6; --mini-line: #34405C;
  --title-line-h: 4px; --title-line-gap: 6px; --title-line-op: .9;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { max-width: 1180px; margin: 0 auto; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.small { font-size: 13px; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
a { color: var(--accent); }
b, strong { font-weight: 700; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Nagłówek */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.brand-k { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 5vw, 40px); letter-spacing: -.02em; line-height: 1.05; }
.brand h1 { display: inline-block; }
.brand h1::after { content: ""; display: block; height: var(--title-line-h); width: 100%; margin-top: var(--title-line-gap); background: var(--marker); opacity: var(--title-line-op); position: relative; z-index: -1; border-radius: 2px; }
.top-actions, .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.lang { display: inline-flex; padding: 3px; gap: 2px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); }
.lang button { font: 700 13px/1 var(--f-mono); letter-spacing: .06em; border: 0; background: none; color: var(--muted); padding: 8px 11px; border-radius: 999px; cursor: pointer; }
.lang button:hover { color: var(--ink); }
.lang button.on { background: var(--ink); color: var(--surface); }
.btn { font: 600 14px/1 var(--f-body); border-radius: 999px; padding: 10px 16px; cursor: pointer; border: 1.5px solid transparent; transition: background .15s, border-color .15s; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--accent); }
.btn-ghost.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn-text { background: none; color: var(--muted); }
.btn-x { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 18px; cursor: pointer; flex: none; }
.btn-x:hover { color: var(--bad); border-color: var(--bad); }

.confirm { background: var(--surface); border: 2px solid var(--accent); border-radius: var(--r); padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.fake { display: inline-block; font: 600 10.5px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); padding: 4px 7px; border-radius: 999px; white-space: nowrap; }
.fakebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; color: var(--muted); }
.exnote { font-size: 13px; color: var(--muted); max-width: 90ch; margin-top: -6px; }
.exnote b { color: var(--ink); font-weight: 600; }

/* Etapy */
.stepper { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 6px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.stepper ol { list-style: none; margin: 0; padding: 4px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.stepper button { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background: none; border: 0; border-radius: 999px; padding: 8px 6px; font: 600 14px var(--f-body); color: var(--muted); cursor: pointer; }
.stepper button:hover { color: var(--ink); background: var(--surface-2); }
.st-n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--f-mono); border: 1.5px solid currentColor; flex: none; }
.stepper button.done { color: var(--ink); }
.stepper button.done .st-n { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.stepper button.cur { background: var(--accent); color: var(--accent-ink); }
.stepper button.cur .st-n { border-color: var(--accent-ink); }
@media (max-width: 760px) { .st-t { display: none; } .stepper button.cur .st-t { display: inline; } .stepper ol { grid-template-columns: auto; display: flex; } .stepper li { flex: 1 1 auto; } .stepper li:has(.cur) { flex: 3 1 auto; } }

.layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .layout.with-mini { grid-template-columns: minmax(0, 1fr) 260px; align-items: start; } }
main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.stage { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.stage-head { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; }
.eyebrow { font: 600 12px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.stage-head h2 { font-family: var(--f-display); font-weight: 500; font-size: clamp(22px, 3.6vw, 30px); letter-spacing: -.015em; }
.lede { color: var(--muted); max-width: 65ch; font-size: 16px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.card-h h3, .examples-head h3, .tasks-head h3 { font-size: 17px; font-weight: 700; }
.sec { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--ink); color: var(--surface); font: 700 13px var(--f-mono); margin-right: 8px; vertical-align: 1px; }
.grid2, .grid3 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.grid3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

/* Pola */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lab { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.lab label, .lab-t { font-weight: 600; font-size: 14px; }
.field input, .row-edit input, textarea, .inwrap input { width: 100%; font: 500 15px var(--f-body); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.field input:focus, .row-edit input:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.inwrap { position: relative; display: flex; align-items: center; }
.inwrap input { padding-right: 52px; font-variant-numeric: tabular-nums; }
.inwrap.sm input { padding: 7px 40px 7px 9px; font-size: 14px; }
.suffix { position: absolute; right: 12px; color: var(--muted); font-size: 13px; pointer-events: none; }
.has-err input, input[aria-invalid="true"] { border-color: var(--bad); background: var(--bad-soft); }
.err { color: var(--bad); font-size: 13px; font-weight: 600; }
.hint { color: var(--muted); font-size: 13px; max-width: 70ch; }
.is-off { opacity: .6; }
.calcline { font-size: 14px; background: var(--surface-2); border-radius: 8px; padding: 8px 12px; font-variant-numeric: tabular-nums; }
.term-btn { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); font: 700 12px var(--f-body); cursor: pointer; flex: none; padding: 0; }
.term-btn.on, .term-btn:hover { background: var(--accent); color: var(--accent-ink); }
.termbox { font-size: 13px; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; line-height: 1.45; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { flex: 1 1 140px; text-align: left; background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; color: var(--ink); display: flex; flex-direction: column; gap: 2px; font-family: var(--f-body); }
.seg button:hover { border-color: var(--accent); }
.seg button.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.seg-t { font-weight: 700; font-size: 14px; }
.seg-d { font-size: 12px; color: var(--muted); }

.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track { width: 44px; height: 26px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.toggle input:checked + .track { background: var(--accent); }
.toggle input:checked + .track .knob { transform: translateX(18px); }
.toggle input:focus-visible + .track { outline: 3px solid var(--accent); outline-offset: 2px; }
.emp { display: flex; flex-direction: column; gap: 12px; border-top: 1px dashed var(--line); padding-top: 14px; }
.emp-note { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; grid-column: span 2; }
@media (max-width: 640px) { .emp-note { grid-column: auto; } }

.notice { border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; border: 1px solid; }
.notice ul { margin: 4px 0 8px; padding-left: 20px; }
.notice .btn { align-self: flex-start; }
.notice-t { font-size: 15px; }
.notice.info { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.notice.plain { background: var(--surface-2); border-color: var(--line); }
.notice.warn { background: var(--warn-soft); border-color: var(--warn); }
.notice.warn .notice-t { color: var(--warn); }
.notice.bad { background: var(--bad-soft); border-color: var(--bad); }
.notice.bad .notice-t { color: var(--bad); }

/* Przykłady */
.examples-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.agebox { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; background: var(--bg); }
.agebox h4 { font-size: 15px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 13px var(--f-body); padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.chip.on { border-color: var(--accent); background: var(--accent-soft); }
.examples-wrap { margin-top: 10px; padding: 18px; border-radius: var(--r); background: var(--surface-2); border: 1.5px dashed var(--line); display: flex; flex-direction: column; gap: 10px; }
.examples-wrap .eyebrow { color: var(--muted); }
.examples-wrap .ex { box-shadow: none; }
.examples { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.ex.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.ex h4 { font-family: var(--f-display); font-weight: 500; font-size: 17px; }
.ex-tag { font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.ex .btn { margin-top: auto; align-self: flex-start; }

/* Rynek */
.radii { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .radii { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.radius { border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px; background: var(--surface-2); position: relative; overflow: hidden; }
.radius:nth-child(1) { box-shadow: inset 0 0 0 2px var(--accent); }
.radius-n { font: 700 30px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.radius-l { font-size: 13px; color: var(--muted); font-weight: 600; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 0; }
.meta dt, .exp-dl dt, .mini dt { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.meta dd, .exp-dl dd, .mini dd { margin: 0; font-weight: 600; }
.adv summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); }
.adv[open] { display: flex; flex-direction: column; gap: 10px; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row-edit { display: grid; gap: 6px; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.5fr) minmax(0, .9fr) minmax(0, .7fr) minmax(0, .7fr) auto; align-items: start; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
.row-edit:has(> input:nth-of-type(3):last-of-type) { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.4fr) auto; }
.row-edit input { padding: 8px 10px; font-size: 14px; }
.row-err { grid-column: 1 / -1; }
@media (max-width: 760px) { .row-edit, .row-edit:has(> input:nth-of-type(3):last-of-type) { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; } }
.empty { color: var(--muted); font-size: 14px; padding: 12px; border: 1.5px dashed var(--line); border-radius: 10px; text-align: center; }
.tblwrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl thead th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tbl .r { text-align: right; white-space: nowrap; }
.pull { margin: 4px 0 0; font-family: var(--f-display); font-weight: 500; font-size: clamp(16px, 2.2vw, 20px); line-height: 1.4; padding: 4px 0 4px 18px; border-left: 4px solid var(--marker); max-width: 60ch; }

/* Wyniki */
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.tile-l { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tile-v { font: 700 22px/1.2 var(--f-display); letter-spacing: -.01em; overflow-wrap: anywhere; }
.tile-s { font-size: 13px; color: var(--muted); }
.tile.good { border-color: var(--good); background: var(--good-soft); } .tile.good .tile-v { color: var(--good); }
.tile.bad { border-color: var(--bad); background: var(--bad-soft); } .tile.bad .tile-v { color: var(--bad); }
.tile.warn { border-color: var(--warn); background: var(--warn-soft); } .tile.warn .tile-v { color: var(--warn); }

.split { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
.receipt { background: var(--paper); color: var(--paper-ink); font-family: var(--f-mono); font-size: 13px; padding: 22px 20px 26px; border-radius: 4px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 1px 0 var(--line), 0 10px 24px -14px rgba(10,20,40,.35);
  -webkit-mask: radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) 50% 100% / 14px 100% repeat-x;
          mask: radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) 50% 100% / 14px 100% repeat-x; }
.rc-h { text-align: center; font-weight: 600; letter-spacing: .3em; font-size: 14px; }
.rc-sub { text-align: center; color: var(--muted); }

        <${TextField} st=${st} set=${set} path=${['idea', 'address']} label=${L('Ulica lokalu', 'Street of your location')} placeholder=${L('np. Krucza', 'e.g. Krucza')} hint=${L('Wpisz samą nazwę ulicy, bez „ul.” i bez numeru. Od tej ulicy liczymy odległości do konkurencji.', 'Enter just the street name, without a house number. Distances to competitors are measured from this street.')} />
      </div>
      <${AreaPicker} st=${st} onPick=${p.pickArea} onClear=${function () { set(['idea', 'area'], ''); }} />` : null}

      <div className="field">
        <div className="lab"><span className="lab-t">${L('Co liczysz jako jedną sprzedaż?', 'What counts as one sale?')}</span></div>
        <${Seg} label=${L('Jednostka sprzedaży', 'Unit of sale')} value=${i.unit} onChange=${function (v) { set(['idea', 'unit'], v); }}
          options=${Object.keys(UNITS).map(function (k) { return [k, L(UNITS[k].label[0], UNITS[k].label[1]), L(UNITS[k].desc[0], UNITS[k].desc[1])]; })} />
        <p className="hint">${L('Klient to osoba. Jednostka to to, co ta osoba kupuje. Jeden klient może w miesiącu kupić kilka jednostek, np. 4 godziny korepetycji albo 2 zamówienia.', 'A customer is a person. A unit is what that person buys. One customer can buy several units a month, e.g. 4 hours of tutoring or 2 orders.')}</p>
      </div>
    </div>

    <div className="examples-wrap">
    <p className="eyebrow">${L('Nie wiesz, od czego zacząć?', 'Not sure where to start?')}</p>
    <div className="examples-head"><h3>${L('Wczytaj gotowy przykład', 'Load a ready-made example')}</h3><${Fake}>${L('założenia fikcyjne', 'fictional assumptions')}<//></div>
    <p className="muted small">${L('Każdy przykład wczytuje komplet wymyślonych liczb do ćwiczeń. Nie są to dane rynkowe ani aktualne stawki. Wszystkie pola możesz potem zmienić.', 'Each example loads a full set of made-up numbers for practice. They are not market data or current rates. You can change every field afterwards.')}</p>
    <div className="examples">
      ${EXAMPLES.map(function (e) {
        var active = !!st.example && findExample(st.example) === e;
        return html`<article key=${e.id} className=${'ex' + (active ? ' active' : '')}>
          <p className="ex-tag">${L(e.tag[0], e.tag[1])}</p>
          <h4>${exName(e)}</h4>
          <p className="small muted">${L(e.blurb[0], e.blurb[1])}</p>
          <button type="button" className="btn btn-ghost" onClick=${function () { p.askExample(e.id); }}>${active ? L('Wczytany', 'Loaded') : L('Wczytaj przykład', 'Load example')}</button>
        </article>`;
      })}

    </div>
  </section>`;
}

/* ---------- ETAP 2 ---------- */
function distText(d) { return d >= 1000 ? num(d / 1000, 2) + ' km' : num(d) + ' m'; }

function OsmFinder(p) {
  var st = p.st, m = st.market;
  var guessed = guessOsmCat(st.idea.type);
  var catS = useState(guessed || (m.osm && m.osm.cat) || ''), catId = catS[0], setCatId = catS[1];
  var stS = useState({ s: 'idle' }), status = stS[0], setStatus = stS[1];
  var cat = osmCat(catId);
  var fictional = /fikcyj|fictional/i;
  var area = st.idea.area ? AREA_BY_CODE[st.idea.area] : null;
  var addr = String(st.idea.address || '').trim(), city = String(st.idea.city || '').trim();
  if (fictional.test(addr)) addr = ''; if (fictional.test(city)) city = '';
  /* zawsze sama ulica: bez „ul.” i bez numeru budynku */
  addr = addr.replace(/^\s*(ulica\s+|ul\.\s*|ul\s+|al\.\s*|pl\.\s*|os\.\s*)/i, '').replace(/\s+\d+[a-zA-Z]?([\/-]\d+[a-zA-Z]?)?\s*$/, '').trim();
  if (!city && area) city = area[2] === 8 ? 'Warszawa' : area[1];
  var where = [addr, city].filter(Boolean).join(', ');
  var la0 = parseNum(m.lat), lo0 = parseNum(m.lon), hasCoords = !la0.empty && !lo0.empty && !la0.bad && !lo0.bad;
  function geocode() {
    if (addr && city) {
      /* Mapa nie rozpoznaje skrótów „ul.”, „al.” itp., więc je usuwamy. Kolejność prób: ulica z numerem i miasto osobno,
         ten sam adres jako jeden tekst, na końcu sama ulica. Serwer pozwala na 1 zapytanie na sekundę, więc między próbami czekamy. */
      var street = addr.replace(/^\s*(ulica\s+|ul\.\s*|ul\s+|al\.\s*|pl\.\s*|os\.\s*)/i, '').trim();
      var noNum = street.replace(/\s+\d+[a-zA-Z]?([\/-]\d+[a-zA-Z]?)?\s*$/, '').trim();
      var base = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=pl&accept-language=pl';
      var enc = encodeURIComponent;
      /* szukamy zawsze samej ulicy: numer budynku (jeśli ktoś go wpisał) pomijamy */
      var st0 = noNum || street;
      var tries = [{ u: base + '&street=' + enc(st0) + '&city=' + enc(city) }, { u: base + '&q=' + enc(st0 + ', ' + city) }];
      var wait = function (ms) { return new Promise(function (res) { setTimeout(res, ms); }); };
      var attempt = function (i, retried) {
        return wait(i > 0 || retried ? 1100 : 0).then(function () { return fetch(tries[i].u); })
          .then(function (r) {
            if (r.status === 429 && !retried) return wait(1000).then(function () { return attempt(i, true); });
            if (!r.ok) throw new Error(r.status === 429 ? 'busy' : 'geo');
            return r.json().then(function (j) {
              if (j && j.length) return { lat: parseFloat(j[0].lat), lon: parseFloat(j[0].lon), approx: !!tries[i].approx };
              if (i + 1 < tries.length) return attempt(i + 1);
              throw new Error('noaddr');
            });
          });
      };
      return attempt(0);
    }
    if (hasCoords) return Promise.resolve({ lat: la0.v, lon: lo0.v });
    return Promise.reject(new Error('needaddr'));
  }
  function run() {
    if (!cat || status.s === 'loading') return;
    setStatus({ s: 'loading' });
    var pt;
    geocode().then(function (g) {
      pt = g;
      return fetch('https://overpass-api.de/api/interpreter', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'data=' + encodeURIComponent(osmQuery(cat, g.lat, g.lon)) });
    }).then(function (r) { if (!r.ok) throw new Error(r.status === 429 ? 'busy' : 'osm'); return r.json(); })
      .then(function (j) {
        var res = osmToItems(j, pt.lat, pt.lon), today = new Date().toISOString().slice(0, 10);
        p.apply(function (s) {
          var manual = s.market.items.filter(function (x) { return x.src !== 'osm'; });
          return Object.assign({}, s, { market: Object.assign({}, s.market, {
            mode: 'manual', items: manual.concat(res.items), lat: pt.lat.toFixed(6), lon: pt.lon.toFixed(6),
            source: 'OpenStreetMap (© autorzy OpenStreetMap)', date: today,
            osm: { cat: cat.id, found: res.found, hidden: res.hidden, date: today }
          }) });
        });
        setStatus({ s: 'ok', found: res.found, kept: res.items.length, approx: pt.approx });
      })
      .catch(function (e) {
        var code = e && e.message;
        setStatus({ s: 'err', t: code === 'needaddr' ? L('Wpisz w etapie 1 prawdziwy adres i miejscowość (albo wybierz gminę i podaj ulicę).', 'In step 1 enter a real address and town (or choose your municipality and add the street).')
          : code === 'noaddr' ? L('Nie znaleziono ulicy „' + where + '”. Sprawdź pisownię ulicy i miejscowości (np. „Krucza” i „Warszawa”).', 'The street “' + where + '” was not found. Check the spelling of the street and town (e.g. “Krucza” and “Warszawa”).')
          : code === 'busy' ? L('Serwer OpenStreetMap jest teraz przeciążony. Spróbuj za minutę.', 'The OpenStreetMap server is busy right now. Try again in a minute.')
          : L('Nie udało się połączyć z OpenStreetMap. Sprawdź internet. W podglądzie na claude.ai to nie działa, działa na opublikowanej stronie.', 'Could not connect to OpenStreetMap. Check your connection. It does not work in the claude.ai preview, only on the published page.') });
      });
  }
  return html`<div className="card">
    <div className="card-h"><h3>${L('Znajdź konkurentów na mapie', 'Find competitors on the map')}</h3></div>
    <p className="hint">${L('Aplikacja wyszuka w OpenStreetMap firmy wybranego rodzaju w promieniu 5 km od Twojego adresu i wpisze je na listę poniżej, razem z odległością.', 'The app searches OpenStreetMap for businesses of the chosen type within 5 km of your address and adds them to the list below with their distance.')}</p>
    <div className="grid2">
      <div className="field"><label htmlFor="f-osmcat">${L('Rodzaj konkurencji', 'Type of competitor')}</label>
        <select id="f-osmcat" value=${catId} onChange=${function (e) { setCatId(e.target.value); }}>
          <option value="">${L('wybierz…', 'choose…')}</option>
          ${OSM_CATS.map(function (c) { return html`<option key=${c.id} value=${c.id}>${L(c.pl, c.en)}</option>`; })}
        </select>
        ${!guessed && st.idea.type ? html`<p className="hint">${L('Nie rozpoznaliśmy rodzaju „' + st.idea.type + '”. Wybierz najbliższy z listy.', 'We did not recognise “' + st.idea.type + '”. Choose the closest one from the list.')}</p>` : null}</div>
      <div className="field"><span className="lab-t">${L('Szukamy wokół', 'Searching around')}</span>
        <p className="calcline">${addr && city ? where : hasCoords ? L('współrzędne ', 'coordinates ') + m.lat + ', ' + m.lon : L('brak adresu: uzupełnij etap 1', 'no address: fill in step 1')}</p></div>
    </div>
    <div className="btns">
      <button type="button" className="btn btn-primary" disabled=${!cat || status.s === 'loading'} onClick=${run}>${status.s === 'loading' ? L('Szukam…', 'Searching…') : L('Szukaj w OpenStreetMap', 'Search OpenStreetMap')}</button>
      ${status.s === 'ok' ? html`<span className="status" role="status">${L('Znaleziono ' + status.found + '.', 'Found ' + status.found + '.')}${status.found > status.kept ? L(' Na liście ' + status.kept + ' najbliższych, pozostałe wliczone w liczby powyżej.', ' The list shows the ' + status.kept + ' nearest; the rest are included in the counts above.') : ''}</span>` : null}
      ${status.s === 'err' ? html`<span className="status bad" role="status">${status.t}</span>` : null}
    </div>
    <p className="small muted">${L('Mapę tworzą wolontariusze, więc w mniejszych miejscowościach brakuje części firm, a niektóre mogły się już zamknąć. Traktuj wynik jako „co najmniej tylu konkurentów” i dopisz firmy, które znasz. Dane: ', 'The map is made by volunteers, so smaller towns miss some businesses and some may have closed. Treat the result as “at least this many competitors” and add businesses you know. Data: ')}<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© ${L('autorzy OpenStreetMap', 'OpenStreetMap contributors')}</a>.</p>
  </div>`;
}

function StageMarket(p) {
  var st = p.st, set = p.set, m = st.market, local = st.idea.model === 'lokalny', demo = m.mode === 'demo';
  var items = demo ? (local ? demoLocal() : demoOnline()) : m.items;
  var stats = marketStats(items, local, demo ? null : { lat: m.lat, lon: m.lon }, demo ? null : m.osm);
  function addRow() { set(['market', 'items'], m.items.concat([{ id: uid(), name: '', address: '', dist: '', lat: '', lon: '', web: '', note: '' }])); }
  function upd(idx, k, v) { set(['market', 'items', idx, k], v); }
  function del(idx) { set(['market', 'items'], m.items.filter(function (_, j) { return j !== idx; })); }
  var extras = [L('Unikalnych placówek: ', 'Unique businesses: ') + (stats.list.length + stats.hiddenTotal)];
  if (stats.beyond) extras.push(L('dalej niż 5 km: ', 'further than 5 km: ') + stats.beyond);
  if (stats.unknown) extras.push(L('bez odległości: ', 'no distance: ') + stats.unknown);
  if (stats.dupes) extras.push(L('usunięte duplikaty: ', 'duplicates removed: ') + stats.dupes);

  return html`<section className="stage">
    <header className="stage-head"><p className="eyebrow">${L('Etap 2 z 5', 'Step 2 of 5')}</p><h2>${L('Rynek i konkurencja', 'Market and competition')}</h2>
      <p className="lede">${local ? L('Sprawdź, ile podobnych firm działa w pobliżu Twojego punktu.', 'Check how many similar businesses operate near your location.') : L('Zbierz listę firm, które sprzedają podobne rzeczy w internecie w Polsce.', 'Make a list of businesses that sell similar things online in Poland.')}</p></header>

    ${!local ? html`<${Notice} tone="info" title=${L('Konkurencję online zbierasz sama', 'You collect online competitors yourself')}>
      ${L('Sklepów internetowych nie ma na mapie. Sprawdź wyszukiwarkę i platformy sprzedażowe, a firmy wpisz w trybie ręcznym. Nie pokazujemy wymyślonych liczb jako prawdziwych wyników.',
        'Online shops are not on the map. Check search engines and marketplaces, and enter businesses in manual mode. Made-up numbers are never shown as real results.')}
    <//>` : null}

    <div className="field">
      <${Seg} label=${L('Źródło danych', 'Data source')} value=${m.mode} onChange=${function (v) { set(['market', 'mode'], v); }}
        options=${[['manual', L('Wpisz dane ręcznie', 'Enter data manually'), L('Twoje własne ustalenia', 'your own findings')], ['demo', L('Przykład demonstracyjny', 'Demo example'), L('dane fikcyjne do nauki', 'fictional data for learning')]]} />
    </div>

    ${local && !demo ? html`<${OsmFinder} st=${st} apply=${p.apply} />` : null}
    ${local && demo ? html`<p className="hint">${L('Żeby znaleźć prawdziwych konkurentów na mapie, wybierz „Wpisz dane ręcznie”.', 'To find real competitors on the map, choose “Enter data manually”.')}</p>` : null}
    ${demo ? html`<div className="fakebar" role="note"><${Fake} /><span>${L('Wszystkie nazwy, adresy i odległości poniżej są wymyślone. Nie opisują żadnego prawdziwego miejsca.', 'All names, addresses and distances below are made up. They do not describe any real place.')}</span></div>` : null}

    <div className="card">
      <div className="card-h"><h3>${L('Źródło i data', 'Source and date')}</h3></div>
      ${demo ? html`<dl className="meta"><div><dt>${L('Źródło', 'Source')}</dt><dd>${L('Brak. Dane wymyślone na potrzeby ćwiczenia.', 'None. Data invented for this exercise.')}</dd></div><div><dt>${L('Data pozyskania', 'Date collected')}</dt><dd>${L('nie dotyczy', 'not applicable')}</dd></div></dl>`
        : html`<div className="grid2">
          <${TextField} st=${st} set=${set} path=${['market', 'source']} label=${L('Skąd masz dane?', 'Where is the data from?')} placeholder=${local ? L('np. mapa online, spacer po okolicy', 'e.g. online map, a walk around the area') : L('np. wyszukiwarka, platforma sprzedażowa', 'e.g. search engine, marketplace')} />
          <${TextField} st=${st} set=${set} path=${['market', 'date']} label=${L('Data sprawdzenia', 'Date checked')} type="date" />
        </div>
        ${!m.source || !m.date ? html`<p className="hint">${L('Wpisz źródło i datę. Bez nich nie wiadomo, na ile aktualna jest Twoja lista.', 'Enter the source and date. Without them nobody can tell how up to date your list is.')}</p>` : null}`}
    </div>

    ${local ? html`<div className="card">
      <div className="card-h"><h3>${L('Konkurenci w promieniu od ', 'Competitors within a radius of ')}${st.idea.address ? st.idea.address : L('Twojego punktu', 'your location')}</h3></div>
      <div className="radii">
        ${stats.radii.map(function (r) {
          return html`<div key=${r.r} className="radius"><span className="radius-n">${r.count}</span><span className="radius-l">${L('do ', 'within ')}${r.r >= 1000 ? num(r.r / 1000, 1) + ' km' : r.r + ' m'}</span></div>`;
        })}
      </div>
      <p className="hint">${L('Promienie zawierają się w sobie: firma 300 m od Ciebie liczy się w każdym z nich. Nie dodawaj tych liczb do siebie. Odległość liczymy w linii prostej, nie trasą dojazdu.', 'The radii are nested: a business 300 m away counts in every one of them. Do not add these numbers up. Distance is measured in a straight line, not along a route.')}</p>
      <p className="small muted">${extras.join(' · ')}</p>
      <p className="small muted">${L('Lista może być niepełna: część firm nie ma wizytówek w internecie, inne już nie działają. Traktuj wynik jako przybliżenie.', 'The list may be incomplete: some businesses are not listed online, others have closed. Treat the result as an approximation.')}</p>
    </div>` : null}

    ${!demo ? html`<div className="card">
      <div className="card-h"><h3>${local ? L('Twoja lista placówek', 'Your list of businesses') : L('Twoja lista konkurentów online', 'Your list of online competitors')}</h3>
        <button type="button" className="btn btn-ghost" onClick=${addRow}>${L('+ Dodaj firmę', '+ Add business')}</button></div>
      ${local ? html`<details className="adv"><summary>${L('Mam współrzędne zamiast odległości', 'I have coordinates instead of distances')}</summary>
        <p className="hint">${L('Wpisz współrzędne swojego punktu, a przy firmach ich współrzędne. Aplikacja policzy odległość w linii prostej. Jeśli podasz i odległość, i współrzędne, liczy się odległość.', 'Enter the coordinates of your location and of each business. The app will calculate the straight-line distance. If you give both a distance and coordinates, the distance is used.')}</p>
        <div className="grid2">
          <${TextField} st=${st} set=${set} path=${['market', 'lat']} label=${L('Szerokość geogr. Twojego punktu', 'Latitude of your location')} placeholder=${L('np. 52.2297', 'e.g. 52.2297')} />
          <${TextField} st=${st} set=${set} path=${['market', 'lon']} label=${L('Długość geogr. Twojego punktu', 'Longitude of your location')} placeholder=${L('np. 21.0122', 'e.g. 21.0122')} />
        </div></details>` : null}
      ${m.items.length === 0 ? html`<p className="empty">${local ? L('Lista jest pusta. Wyszukaj firmy na mapie albo dodaj pierwszą, którą znasz z okolicy.', 'The list is empty. Add the first business you found nearby.') : L('Lista jest pusta. Dodaj pierwszą firmę, którą znalazłeś.', 'The list is empty. Add the first business you found.')}</p>` : null}
      ${(function () {
        function row(it, idx) {
          var dErr = local ? fieldError(it.dist) : null;
          return html`<div key=${it.id} className="row-edit">
            <label className="sr" htmlFor=${'n-' + it.id}>${L('Nazwa', 'Name')}</label>
            <input id=${'n-' + it.id} placeholder=${L('Nazwa firmy', 'Business name')} value=${it.name} onChange=${function (e) { upd(idx, 'name', e.target.value); }} />
            ${local ? html`<input aria-label=${L('Adres', 'Address')} placeholder=${L('Adres', 'Address')} value=${it.address} onChange=${function (e) { upd(idx, 'address', e.target.value); }} />
              <div className="inwrap"><input aria-label=${L('Odległość w metrach', 'Distance in metres')} inputMode="decimal" placeholder=${L('Odległość', 'Distance')} value=${it.dist} aria-invalid=${!!dErr} onChange=${function (e) { upd(idx, 'dist', e.target.value); }} /><span className="suffix">m</span></div>
              <input aria-label=${L('Szerokość geograficzna', 'Latitude')} inputMode="decimal" placeholder=${L('Szer. (opcj.)', 'Lat. (opt.)')} value=${it.lat} onChange=${function (e) { upd(idx, 'lat', e.target.value); }} />
              <input aria-label=${L('Długość geograficzna', 'Longitude')} inputMode="decimal" placeholder=${L('Dł. (opcj.)', 'Lon. (opt.)')} value=${it.lon} onChange=${function (e) { upd(idx, 'lon', e.target.value); }} />`
              : html`<input aria-label=${L('Strona lub platforma', 'Website or marketplace')} placeholder=${L('Strona lub platforma', 'Website or marketplace')} value=${it.web} onChange=${function (e) { upd(idx, 'web', e.target.value); }} />
              <input aria-label=${L('Uwagi', 'Notes')} placeholder=${L('Co sprzedaje, czym się wyróżnia', 'What it sells, what makes it stand out')} value=${it.note} onChange=${function (e) { upd(idx, 'note', e.target.value); }} />`}
            <button type="button" className="btn-x" aria-label=${L('Usuń', 'Remove')} onClick=${function () { del(idx); }}>×</button>
            ${dErr ? html`<div className="err row-err">${L('Odległość: ', 'Distance: ')}${dErr.toLowerCase()}</div>` : null}
          </div>`;
        }
        var man = [], osm = [];
        m.items.forEach(function (it, idx) { (it.src === 'osm' ? osm : man).push(row(it, idx)); });
        return html`<div className="rows">${man}</div>
          ${!osm.length && m.osm && m.osm.packed ? html`<p className="hint">${L('Ten plan zawiera ' + m.osm.packed + ' firm z OpenStreetMap: są wliczone w liczby konkurentów powyżej, ale ich lista nie jest przesyłana w kodzie planu. Kliknij „Szukaj w OpenStreetMap”, żeby ją zobaczyć.', 'This plan includes ' + m.osm.packed + ' businesses from OpenStreetMap: they are counted above, but their list is not sent in the plan code. Click “Search OpenStreetMap” to see it.')}</p>` : null}
          ${osm.length ? html`<details className="adv"><summary>${L('Firmy z OpenStreetMap (' + osm.length + '): rozwiń, aby poprawić lub usunąć', 'Businesses from OpenStreetMap (' + osm.length + '): expand to edit or remove')}</summary><div className="rows">${osm}</div></details>` : null}`;
      })()}
    </div>` : null}

    <div className="card">
      <div className="card-h"><h3>${demo ? L('Wyniki (przykład fikcyjny)', 'Results (fictional example)') : L('Wyniki po usunięciu duplikatów', 'Results after removing duplicates')}</h3>${demo ? html`<${Fake} />` : null}</div>
      ${stats.list.length === 0 ? html`<p className="empty">${L('Brak firm na liście.', 'No businesses on the list.')}</p>` : html`<div className="tblwrap"><table className="tbl">
        <thead><tr><th>${L('Nazwa', 'Name')}</th>${local ? html`<th>${L('Adres', 'Address')}</th><th className="r">${L('Odległość', 'Distance')}</th>` : html`<th>${L('Strona / platforma', 'Website / marketplace')}</th><th>${L('Uwagi', 'Notes')}</th>`}</tr></thead>
        <tbody>${stats.list.map(function (x, j) {
          return html`<tr key=${x.id || j}><td>${x.name}</td>${local ? html`<td>${x.address || '—'}</td><td className="r num">${x.d == null ? L('brak danych', 'no data') : distText(x.d)}${x.calcd ? html`<span className="small muted">${L(' (wyliczona)', ' (calculated)')}</span>` : null}</td>` : html`<td>${x.web || '—'}</td><td>${x.note || '—'}</td>`}</tr>`;
        })}</tbody></table></div>`}
      ${!local ? html`<p className="hint">${L('Liczba wyników w wyszukiwarce to nie liczba firm na rynku. Jedna firma może mieć wiele stron, a wiele stron to katalogi albo artykuły. Licz tylko firmy, które naprawdę sprawdziłeś.', 'The number of search results is not the number of businesses on the market. One business can have many pages, and many pages are directories or articles. Count only businesses you have actually checked.')}</p>` : null}
    </div>

    <${MarketSizeCard} st=${st} set=${set} ms=${p.ms} />

  </section>`;
}

function MarketSizeCard(p) {
  var st = p.st, set = p.set, ms = p.ms, sz = st.market.size, local = ms.local;
  var stats = null;
  var compWord = function (n) { return L(n + ' ' + plural(n, ['konkurent', 'konkurentów', 'konkurentów', 'konkurenta']), n + ' ' + (n === 1 ? 'competitor' : 'competitors')); };
  var curClients = parseNum(st.sales.clients);
  var area = st.idea.area ? AREA_BY_CODE[st.idea.area] : null;

  var densHint = (ms.fromDens ? L('W promieniu ' + rTxt + ' mieszka ok. ' + num(ms.people) + ' os. (gęstość × π × r²). ', 'About ' + num(ms.people) + ' people live within ' + rTxt + ' (density × π × r²). ')

    + (area ? L('Dane GUS 2025 dla: ' + area[1] + '. To średnia dla całej gminy: w centrum miasta mieszka zwykle więcej osób, na obrzeżach i na wsi mniej.', 'GUS 2025 data for ' + area[1] + '. It is the average for the whole municipality: town centres are usually denser, outskirts and villages less so.')
      : L('Wybierz gminę w etapie 1, a wpiszemy tu prawdziwą wartość.', 'Choose your municipality in step 1 and the real value will be filled in.'));
  return html`<div className="card">
    <div className="card-h"><h3>${L('Ilu klientów może dać ten rynek?', 'How many customers could this market give you?')}</h3></div>
    ${area && areaPow(area) ? html`<p className="calcline">${L('Mieszkańcy: ', 'Residents: ')}<b>${L('ok. ', 'about ') + num(Math.round(area[3] * Math.PI * Math.pow(ms.r / 1000, 2)))}</b>${L(' w promieniu ' + rTxt + ' (gęstość ' + num(area[3]) + ' os./km² × pole koła)', ' within ' + rTxt + ' (density ' + num(area[3]) + '/km² × circle area)')}${area[4] ? html` · ${L('gmina ' + area[1] + ': ', area[1] + ': ')}<b>${num(area[4])}</b>` : null} · ${L('cały powiat ' + areaPow(area)[0] + ': ', 'whole county (' + areaPow(area)[0] + '): ')}<b>${num(areaPow(area)[4])}</b> ${L('(GUS 2025)', '(GUS 2025)')}</p>` : null}
    <p className="hint">${L('Szacunek od góry: ile osób z Twojej grupy docelowej kupuje taką usługę lub produkt w miesiącu i jaką część z nich przejmiesz.', 'A top-down estimate: how many people in your target group buy this kind of product or service in a month, and what share of them you could win.')}</p>
    ${local ? html`<div className="field"><span className="lab-t">${L('Z jakiej odległości przychodzą klienci?', 'How far do your customers come from?')}</span>
      <${Seg} label=${L('Zasięg', 'Radius')} value=${String(sz.radius)} onChange=${function (v) { set(['market', 'size', 'radius'], v); }}
        options=${RADII.map(function (r) { return [String(r), L('do ', 'within ') + (r >= 1000 ? num(r / 1000, 1) + ' km' : r + ' m'), String(r) === String(sz.radius) ? compWord(ms.comp) + L(' w tym zasięgu', ' in this radius') : '']; })} /></div>` : null}
    ${area && areaPow(area) && AGES[area[0].slice(0, 4)] ? (function () {
      var sz = st.market.size, k = area[0].slice(0, 4), pw = areaPow(area);
      var fr = parseInt(sz.ageFrom, 10); if (!(fr >= 0)) fr = 0;
      var to = parseInt(sz.ageTo, 10); if (!(to >= 0)) to = 17; if (to < fr) to = fr;
      var sx = sz.sex === 'f' || sz.sex === 'm' ? sz.sex : 'all';
      var ag = ageShare(k, fr, to, sx), inR = Math.round(area[3] * Math.PI * Math.pow(ms.r / 1000, 2) * ag.share);
      var presets = [[L('Wszyscy', 'Everyone'), 0, 17, 'all'], [L('Dzieci 5–14', 'Children 5–14'), 1, 2, 'all'], [L('Uczniowie 15–19', 'Students 15–19'), 3, 3, 'all'],
        [L('Młodzi dorośli 20–34', 'Young adults 20–34'), 4, 6, 'all'], [L('Dorośli 20–64', 'Adults 20–64'), 4, 12, 'all'], [L('Seniorzy 65+', 'Seniors 65+'), 13, 17, 'all']];
      function setGroup(f, t, x) { set(['market', 'size', 'ageFrom'], String(f)); set(['market', 'size', 'ageTo'], String(t)); set(['market', 'size', 'sex'], x); }
      var allAges = fr === 0 && to === 17;
      var ageTxt = allAges ? L('w każdym wieku', 'of all ages') : to === 17 ? AGE_START[fr] + '+' : AGE_START[fr] + '–' + (AGE_START[to] + 4) + L(' lat', '');
      var groupTxt = sx === 'f' ? L('kobiety ', 'women ') + ageTxt : sx === 'm' ? L('mężczyźni ', 'men ') + ageTxt : allAges ? L('wszyscy mieszkańcy', 'all residents') : ageTxt;
      return html`<div className="agebox">
        <h4>${L('Kto jest Twoim klientem? Wiek i płeć mieszkańców powiatu (GUS 2025)', 'Who is your customer? Age and sex of county residents (GUS 2025)')}</h4>
        <div className="chips">${presets.map(function (q) { var on = q[1] === fr && q[2] === to && q[3] === sx;
          return html`<button key=${q[0]} type="button" className=${'chip' + (on ? ' on' : '')} aria-pressed=${on} onClick=${function () { setGroup(q[1], q[2], q[3]); }}>${q[0]}</button>`; })}</div>
        <div className="grid2">
          <div className="field"><div className="lab"><label htmlFor="f-age-from">${L('Wiek od', 'Age from')}</label></div>
            <select id="f-age-from" value=${String(fr)} onChange=${function (e) { var f = +e.target.value; setGroup(f, Math.max(f, to), sx); }}>
              ${AGE_START.map(function (v, i) { return html`<option key=${i} value=${String(i)}>${v} ${L('lat', '')}</option>`; })}</select></div>
          <div className="field"><div className="lab"><label htmlFor="f-age-to">${L('Wiek do', 'Age to')}</label></div>
            <select id="f-age-to" value=${String(to)} onChange=${function (e) { var t = +e.target.value; setGroup(Math.min(fr, t), t, sx); }}>
              ${AGE_START.map(function (v, i) { return html`<option key=${i} value=${String(i)}>${i === 17 ? L('bez górnej granicy', 'no upper limit') : (v + 4) + ' ' + L('lat', '')}</option>`; })}</select></div>
        </div>
        <div className="field"><div className="lab"><span className="lab-t">${L('Płeć', 'Sex')}</span></div>
          <${Seg} label=${L('Płeć', 'Sex')} value=${sx} onChange=${function (v) { set(['market', 'size', 'sex'], v); }} options=${[['all', L('Wszyscy', 'All')], ['f', L('Kobiety', 'Women')], ['m', L('Mężczyźni', 'Men')]]} /></div>
        <p className="calcline">${L('Grupa „' + groupTxt + '” to ', 'The group “' + groupTxt + '” is ')}<b>${num(ag.share * 100, 1)}%</b>${L(' mieszkańców powiatu ' + pw[0] + ', czyli ', ' of residents in the county (' + pw[0] + '), so ')}<b>${L('ok. ', 'about ') + num(inR)}</b>${L(' w promieniu ' + rTxt + ' i ', ' within ' + rTxt + ' and ')}<b>${num(ag.count)}</b>${L(' w całym powiecie.', ' in the whole county.')}</p>
        <div className="btns"><button type="button" className="btn btn-ghost" onClick=${function () { set(['market', 'size', 'pop'], String(inR)); }}>${L('Użyj: w promieniu', 'Use: within radius')}</button>
          <button type="button" className="btn btn-ghost" onClick=${function () { set(['market', 'size', 'pop'], String(ag.count)); }}>${L('Użyj: cały powiat', 'Use: whole county')}</button></div>
        <p className="small muted">${L('Udział grupy liczymy dla całego powiatu i przenosimy na promień wokół lokalu. W dzielnicach i osiedlach struktura wieku może się trochę różnić.', 'The group share is calculated for the whole county and applied to the radius around your location. Districts and estates may differ a little.')}</p>
      </div>`; })() : null}
    <div className="grid3">
      <${NumField} st=${st} set=${set} path=${['market', 'size', 'pop']} label=${local ? L('Osoby z grupy docelowej w tym zasięgu', 'People in your target group within this radius') : L('Osoby z grupy docelowej w Polsce', 'People in your target group in Poland')} suffix=${L('os.', 'ppl')} hint=${L('Np. wszyscy mieszkańcy dla fryzjera, uczniowie dla korepetycji.', 'E.g. all residents for a hairdresser, school students for tutoring.')} />
      ${local ? html`<${NumField} st=${st} set=${set} path=${['market', 'size', 'density']} label=${L('…albo gęstość zaludnienia', '…or population density')} suffix=${L('os./km²', '/km²')} hint=${densHint} />` : null}
      <${NumField} st=${st} set=${set} path=${['market', 'size', 'pct']} label=${L('Jaki procent z nich korzysta z takiej oferty', 'What percentage of them use this kind of offer')} suffix="%" max=${100} />
      <${NumField} st=${st} set=${set} path=${['market', 'size', 'every']} label=${L('Jak często kupują: co ile miesięcy', 'How often they buy: every how many months')} suffix=${L('mies.', 'mo')} placeholder="1" hint=${L('Np. 2 to raz na dwa miesiące. Puste pole oznacza co miesiąc.', 'E.g. 2 means once every two months. Empty means every month.')} />
      <${NumField} st=${st} set=${set} path=${['market', 'size', 'share']} label=${L('Twój udział w rynku', 'Your market share')} suffix="%" max=${100} placeholder=${num(ms.autoShare * 100, 1)} hint=${L('Puste pole: równy podział między Ciebie a ' + compWord(ms.comp) + ', czyli ' + num(ms.autoShare * 100, 1) + '%.', 'Empty: an equal split between you and ' + compWord(ms.comp) + ', so ' + num(ms.autoShare * 100, 1) + '%.')} />
    </div>
    ${ms.ok ? html`<p className="calcline">${num(ms.people)} ${L('os.', 'ppl')} × ${num(ms.pct, 1)}% ÷ ${num(ms.ev, 1)} ${L('mies.', 'mo')} = <b>${num(ms.buyers)}</b> ${L('kupujących w miesiącu', 'buyers a month')} × ${num(ms.sh * 100, 1)}% ${L('udziału', 'share')}</p>
      <div className="est"><div><p className="tile-l">${L('Szacowani klienci miesięcznie', 'Estimated customers a month')}</p><p className="est-n">${L('ok. ', 'about ')}${num(ms.est)}</p></div>
        <button type="button" className="btn btn-primary" onClick=${function () { set(['sales', 'clients'], String(Math.round(ms.est))); }}>${L('Wpisz ' + num(ms.est) + ' w etapie 3', 'Use ' + num(ms.est) + ' in step 3')}</button>

      : html`<p className="hint">${L('Wpisz liczbę osób' + (local ? ' albo gęstość zaludnienia' : '') + ' oraz procent korzystających, a pojawi się szacunek.', 'Enter the number of people' + (local ? ' or the population density' : '') + ' and the percentage who use the offer, and the estimate will appear.')}</p>`}
    <p className="small muted">${L('To górna granica. Nowa firma zwykle zaczyna od mniejszego udziału, bo klienci są przywiązani do miejsc, które znają.', 'This is an upper bound. A new business usually starts with a smaller share, because customers stick with places they already know.')}</p>
  </div>`;
}

        <${NumField} st=${st} set=${set} path=${['sales', 'upc']} label=${L('Jednostki kupowane przez 1 klienta w miesiącu', 'Units bought by one customer per month')} suffix=${F[2]} hint=${L('Np. 1 strzyżenie albo 4 godziny lekcji.', 'E.g. 1 haircut or 4 hours of lessons.')} />
        <${NumField} st=${st} set=${set} path=${['sales', 'clients']} label=${st.demand.on ? L('Przewidywana liczba klientów przy cenie odniesienia', 'Expected customers at the reference price') : L('Przewidywana liczba klientów w miesiącu', 'Expected customers per month')} suffix=${L('os.', 'ppl')} hint=${L('To Twoje założenie, nie prognoza.', 'This is your assumption, not a forecast.') + (p.ms && p.ms.ok ? L(' Szacunek z etapu 2: ok. ' + num(p.ms.est) + '.', ' Estimate from step 2: about ' + num(p.ms.est) + '.') : '')} />

        ${st.demand.on ? html`<div className="grid3">

          <${NumField} st=${st} set=${set} path=${['demand', 'loss']} label=${L('Jaki procent klientów stracisz, gdy podniesiesz cenę o 10%?', 'What percentage of customers will you lose if you raise the price by 10%?')} suffix="%" max=${95} term="elast" hint=${L('Np. 5%: klienci są przywiązani. 25%: łatwo przejdą do konkurencji.', 'E.g. 5%: loyal customers. 25%: they will easily switch to a competitor.')} />
          ${c.elast != null ? html`<div className="emp-note small">${elastText(c)}${c.price > 0 ? html`<br/>${L('Przy cenie ' + money(c.price) + ': ok. ' + num(c.clients) + ' ' + klientow(Math.round(c.clients)) + ' (' + num(c.clients0) + ' przy cenie ' + money(c.refPrice) + ').', 'At ' + money(c.price) + ': about ' + num(c.clients) + ' ' + klientow(Math.round(c.clients)) + ' (' + num(c.clients0) + ' at ' + money(c.refPrice) + ').')}` : null}</div>` : null}

        <${NumField} st=${st} set=${set} path=${['fixed', 'zus']} label=${L('ZUS i składka zdrowotna właściciela', "Owner's social security (ZUS) and health contribution")} suffix=${Z} hint=${L('Wpisz kwotę sam.', 'Enter the amount yourself.')} />

              'Average gross pay in the county (' + pw[0] + '): ' + money(Math.round(pw[1])) + ' (GUS 2025). With about 20.5% employer contributions that is about ' + money(cost) + ' in total cost. It is an average across all industries; pay in services is usually lower.')}
              <br/><button type="button" className="btn btn-ghost" onClick=${function () { set(['fixed', 'employee'], String(cost)); }}>${L('Wpisz ' + money(cost), 'Use ' + money(cost))}</button></div>`; })() : null}
          <div className="emp-note small">${L('To całkowity koszt pracodawcy: pensja brutto plus składki płacone przez firmę. Pensja netto, którą pracownik dostaje na konto, jest wyraźnie niższa.', "This is the employer's total cost: gross salary plus contributions paid by the business. The net pay the employee actually receives is much lower.")}<br/>${L('Pracownicy obsługują klientów, więc każdy zwiększa możliwości obsługi. Czy Ty też obsługujesz klientów, ustawiasz w części D.', 'Employees serve customers, so each one adds capacity. Whether you serve customers too is set in part D.')}</div>

      </div>

    </div>

    <div className="card">
      <div className="card-h"><h3><span className="sec">C</span> ${L('Koszty zmienne na jedną jednostkę', 'Variable costs per unit')} (${unitWord})</h3></div>

            : html`<${NumField} st=${st} set=${set} path=${['work', 'minutes']} label=${L('Czas jednej usługi', 'Time per service')} suffix="min" />`}
          <${NumField} st=${st} set=${set} path=${['work', 'pct']} label=${L('Czas dostępny na obsługę klientów', 'Share of time spent with customers')} suffix="%" max=${100} hint=${L('Resztę zajmują sprzątanie, zakupy, dojazdy, przerwy.', 'The rest goes on cleaning, shopping, travel and breaks.')} />`
          : html`<${NumField} st=${st} set=${set} path=${['work', 'maxOrders']} label=${L('Maksymalna liczba ' + F[2] + ' w miesiącu', 'Maximum ' + F[2] + ' per month')} suffix=${L('szt.', 'pcs')} hint=${L('Ile realnie przygotujesz i wyślesz w miesiącu.', 'How many you can realistically prepare and ship in a month.')} />`}

        : html`<p className="hint">${L('Wpisz, ile zamówień obsłuży cała firma.', 'Enter how many orders the whole business can handle.')}</p>`}

    <div className="card">

        <${NumField} st=${st} set=${set} path=${['goals', 'investment']} label=${L('Jednorazowa inwestycja na start', 'One-off start-up investment')} suffix=${Z} hint=${L('Sprzęt, remont, wyposażenie.', 'Equipment, renovation, fittings.')} />
      </div>
    </div>

}

/* ---------- Wykresy ---------- */
function niceStep(range, count) {
  var raw = range / count; if (raw <= 0) return 1;
  var p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function ticks(min, max, count) {
  if (max <= min) max = min + 1;
  var s = niceStep(max - min, count || 5), out = [];
  for (var v = Math.ceil(min / s - EPS) * s; v <= max + s * 1e-6; v += s) out.push((Math.round(v * 1e6) / 1e6) || 0);
  return out;
}
function niceUp(v) { if (v <= 0) return 1; var s = niceStep(v, 5); return Math.ceil(v / s - EPS) * s; }
function pts(arr) { return arr.map(function (q) { return q.join(','); }).join(' '); }

function BreakEvenChart(p) {
  var c = p.c;
  var W = 720, H = 360, m = { l: 70, r: 24, t: 50, b: 46 };
  var others = Math.max(c.units, c.be || 0, c.goalUnits || 0, 10);
  var capIn = c.capacity != null && c.capacity <= others * 2.5;
  var base = Math.max(others, capIn ? c.capacity : 0);
  var xmax = niceUp(base * 1.12);
  var costAt = function (u) { return c.fixedTotal + c.unitVar * u; };
  var ymax = niceUp(Math.max(c.price * xmax, costAt(xmax)) * 1.04);
  var x = function (v) { return m.l + (v / xmax) * (W - m.l - m.r); };
  var y = function (v) { return H - m.b - (v / ymax) * (H - m.t - m.b); };
  var xt = ticks(0, xmax, 6), yt = ticks(0, ymax, 5);
  var areas = [];
  var bx = c.cm > 0 ? c.fixedTotal / c.cm : null;
  if (bx != null && bx <= xmax) {
    areas.push(html`<polygon key="loss" points=${pts([[x(0), y(0)], [x(bx), y(c.price * bx)], [x(0), y(c.fixedTotal)]])} fill="var(--bad)" opacity="0.12" />`);
    areas.push(html`<polygon key="gain" points=${pts([[x(bx), y(c.price * bx)], [x(xmax), y(c.price * xmax)], [x(xmax), y(costAt(xmax))]])} fill="var(--good)" opacity="0.14" />`);
  } else {
    areas.push(html`<polygon key="loss" points=${pts([[x(0), y(0)], [x(xmax), y(c.price * xmax)], [x(xmax), y(costAt(xmax))], [x(0), y(c.fixedTotal)]])} fill="var(--bad)" opacity="0.12" />`);
  }
  var marks = [];
  if (c.be != null && c.be <= xmax) marks.push({ v: c.be, label: L('Próg: ', 'Break-even: ') + num(c.be), cls: 'good' });
  if (capIn && c.capacity <= xmax) marks.push({ v: c.capacity, label: L('Limit obsługi: ', 'Capacity: ') + num(c.capacity), cls: 'warn' });
  marks.sort(function (a, b) { return a.v - b.v; });
  /* etykiety: szacujemy szerokość tekstu i przesuwamy do wyższego rzędu, gdy nachodzą na siebie */
  var placed = [];
  marks.forEach(function (mk) {
    var px = x(mk.v), w = mk.label.length * 7.6 + 4, end = px + 6 + w > W - 4;
    var x0 = end ? px - 6 - w : px + 6, x1 = x0 + w, row = 0;
    while (placed.some(function (q) { return q.row === row && x0 < q.x1 + 8 && x1 > q.x0 - 8; })) row++;
    mk.row = row; mk.end = end; placed.push({ x0: x0, x1: x1, row: row });
  });
  return html`<figure className="chart">
    <div className="legend">
      <span><i className="sw" style=${{ background: 'var(--accent)' }}></i>${L('Przychód', 'Revenue')}</span>
      <span><i className="sw" style=${{ background: 'var(--ink)' }}></i>${L('Koszty razem', 'Total costs')}</span>
      <span><i className="sw dash"></i>${L('Koszty stałe', 'Fixed costs')}</span>
      <span><i className="sw" style=${{ background: 'var(--good)', opacity: .5 }}></i>${L('Zysk', 'Profit')}</span>
      <span><i className="sw" style=${{ background: 'var(--bad)', opacity: .4 }}></i>${L('Strata', 'Loss')}</span>
    </div>
    <div className="svgwrap"><svg viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label=${L('Wykres przychodów i kosztów względem liczby sprzedanych jednostek', 'Chart of revenue and costs against units sold')}>
      ${yt.map(function (t) { return html`<g key=${'y' + t}><line x1=${m.l} x2=${W - m.r} y1=${y(t)} y2=${y(t)} stroke="var(--line)" strokeWidth="1" /><text x=${m.l - 8} y=${y(t)} textAnchor="end" dominantBaseline="middle" className="ax">${compact(t)}</text></g>`; })}
      ${xt.map(function (t) { return html`<text key=${'x' + t} x=${x(t)} y=${H - m.b + 18} textAnchor="middle" className="ax">${num(t)}</text>`; })}
      <text x=${(m.l + W - m.r) / 2} y=${H - 6} textAnchor="middle" className="ax-t">${L('Sprzedane jednostki (' + c.F[2] + ') w miesiącu', 'Units sold (' + c.F[2] + ') per month')}</text>
      <text x=${14} y=${m.t - 16} className="ax-t">${cur()}</text>
      ${areas}
      <line x1=${x(0)} y1=${y(c.fixedTotal)} x2=${x(xmax)} y2=${y(c.fixedTotal)} stroke="var(--muted)" strokeWidth="1.5" strokeDasharray="5 5" />
      <line x1=${x(0)} y1=${y(c.fixedTotal)} x2=${x(xmax)} y2=${y(costAt(xmax))} stroke="var(--ink)" strokeWidth="2.5" />
      <line x1=${x(0)} y1=${y(0)} x2=${x(xmax)} y2=${y(c.price * xmax)} stroke="var(--accent)" strokeWidth="2.5" />
      ${marks.map(function (mk) {
        return html`<g key=${mk.label}><line x1=${x(mk.v)} x2=${x(mk.v)} y1=${m.t - 4} y2=${H - m.b} stroke=${'var(--' + mk.cls + ')'} strokeWidth="1.5" strokeDasharray=${mk.cls === 'warn' ? '6 4' : null} />
          <text x=${mk.end ? x(mk.v) - 6 : x(mk.v) + 6} y=${m.t - 12 - mk.row * 16} className=${'mk ' + mk.cls} textAnchor=${mk.end ? 'end' : 'start'}>${mk.label}</text></g>`;
      })}
      ${c.units > 0 && c.units <= xmax ? html`<g>
        <line x1=${x(c.units)} x2=${x(c.units)} y1=${y(Math.max(c.revenue, costAt(c.units)))} y2=${H - m.b} stroke="var(--muted)" strokeWidth="1" strokeDasharray="2 3" />
        <circle cx=${x(c.units)} cy=${y(c.revenue)} r="5" fill="var(--accent)" stroke="var(--surface)" strokeWidth="2" />
        <circle cx=${x(c.units)} cy=${y(costAt(c.units))} r="5" fill="var(--ink)" stroke="var(--surface)" strokeWidth="2" />
        <text x=${x(c.units) > W - 120 ? x(c.units) - 6 : x(c.units)} y=${H - m.b - 8} textAnchor=${x(c.units) > W - 120 ? 'end' : 'middle'} className="mk plan">${L('Twój plan', 'Your plan')}</text>
      </g>` : null}
    </svg></div>
    ${c.capacity != null && !capIn ? html`<figcaption className="small muted">${L('Limit obsługi (', 'Capacity (') + num(c.capacity) + ' ' + uLabel(c, c.capacity) + L(') jest daleko poza zakresem wykresu.', ') is far beyond the range of the chart.')}</figcaption>` : null}
    ${c.capacity == null ? html`<figcaption className="small muted">${L('Limit obsługi pojawi się po uzupełnieniu organizacji pracy w etapie 3.', 'The capacity line appears once you fill in working time in step 3.')}</figcaption>` : null}
  </figure>`;
}

var CAT = ['--c1', '--c2', '--c3', '--c4', '--c5', '--c6', '--c7', '--c8', '--c9', '--c10', '--c11', '--c12', '--c13'];
function CostStructure(p) {
  var c = p.c;
  var fixed = c.fixedItems.filter(function (i) { return i.v > 0; }).map(function (i) { return { l: i.l, v: i.v }; });
  var vars = [
    [c.isService ? L('Materiały', 'Materials') : L('Towar i materiały', 'Goods and materials'), c.mat], [L('Opakowanie', 'Packaging'), c.pack], [L('Dostawa', 'Delivery'), c.deliv], [L('Inne jednostkowe', 'Other unit costs'), c.otherU], [L('Prowizja', 'Commission'), c.commUnit]
  ].map(function (x) { return { l: x[0], v: x[1] * c.units }; }).filter(function (i) { return i.v > 0; });
  var all = fixed.concat(vars);
  var total = all.reduce(function (a, b) { return a + b.v; }, 0);
  if (total <= 0) return html`<p className="empty">${L('Brak kosztów do pokazania.', 'No costs to show.')}</p>`;
  var acc = 0;
  all.forEach(function (it, i) { it.color = 'var(' + CAT[i % CAT.length] + ')'; it.x = acc / total * 100; it.w = it.v / total * 100; acc += it.v; });
  var fixedShare = c.fixedTotal / total * 100;
  function group(list, title, sum) {
    return html`<div className="cs-group"><p className="cs-h">${title} <span className="num">${money(sum)}</span></p>
      <ul className="cs-list">${list.map(function (it) {
        return html`<li key=${it.l}><i className="sw" style=${{ background: it.color }}></i><span className="cs-l">${it.l}</span><span className="num">${money(it.v)}</span><span className="num muted cs-p">${num(it.v / total * 100, 1)}%</span></li>`;
      })}</ul></div>`;
  }
  return html`<figure className="chart">
    <div className="svgwrap"><svg viewBox="0 0 720 64" role="img" aria-label=${L('Struktura miesięcznych kosztów', 'Breakdown of monthly costs')}>
      ${all.map(function (it) { return html`<rect key=${it.l} x=${it.x * 7.2} y="22" width=${Math.max(it.w * 7.2 - 1.5, 0.5)} height="30" fill=${it.color} />`; })}
      ${vars.length && fixed.length ? html`<g><line x1=${fixedShare * 7.2} x2=${fixedShare * 7.2} y1="2" y2="56" stroke="var(--ink)" strokeWidth="2" />
        <text x=${Math.max(fixedShare * 7.2 - 6, 80)} y="14" textAnchor="end" className="ax">${L('stałe ', 'fixed ')}${num(fixedShare)}%</text>
        <text x=${Math.min(fixedShare * 7.2 + 6, 620)} y="14" className="ax">${L('zmienne ', 'variable ')}${num(100 - fixedShare)}%</text></g>` : null}
    </svg></div>
    <div className="cs-cols">
      ${fixed.length ? group(fixed, L('Koszty stałe', 'Fixed costs'), c.fixedTotal) : null}
      ${vars.length ? group(vars, L('Koszty zmienne przy planie', 'Variable costs at your plan'), c.varTotal) : html`<div className="cs-group"><p className="cs-h">${L('Koszty zmienne', 'Variable costs')}</p><p className="small muted">${L('Brak (0 zł przy obecnym planie).', 'None (PLN 0 at your current plan).')}</p></div>`}
    </div>
    <figcaption className="small muted">${L('Razem ', 'Total ') + money(total) + L(' miesięcznie przy planowanej sprzedaży ', ' per month at planned sales of ') + num(c.units, 1) + ' ' + uLabel(c, c.units)}.</figcaption>
  </figure>`;
}

function ScenarioChart(p) {
  var rows = p.rows.filter(function (r) { return r.c.ok; });
  if (!rows.length) return html`<p className="empty">${L('Uzupełnij dane, aby porównać scenariusze.', 'Fill in the data to compare scenarios.')}</p>`;
  var W = 720, H = 300, m = { l: 70, r: 16, t: 24, b: 40 };
  var maxV = Math.max.apply(null, rows.map(function (r) { return Math.max(r.c.revenue, r.c.varTotal + r.c.fixedTotal, r.c.op); }));
  var minV = Math.min(0, Math.min.apply(null, rows.map(function (r) { return r.c.op; })));
  var yt = ticks(minV < 0 ? -niceUp(-minV) : 0, niceUp(maxV), 5);
  var lo = yt[0], hi = yt[yt.length - 1];
  var y = function (v) { return m.t + (hi - v) / (hi - lo) * (H - m.t - m.b); };
  var gw = (W - m.l - m.r) / rows.length, bw = Math.min(46, gw / 4.2);
  var series = [[function (c) { return c.revenue; }, 'var(--accent)'], [function (c) { return c.varTotal + c.fixedTotal; }, 'var(--muted)'], [function (c) { return c.op; }, null]];
  return html`<figure className="chart">
    <div className="legend"><span><i className="sw" style=${{ background: 'var(--accent)' }}></i>${L('Przychód', 'Revenue')}</span><span><i className="sw" style=${{ background: 'var(--muted)' }}></i>${L('Koszty razem', 'Total costs')}</span><span><i className="sw" style=${{ background: 'var(--good)' }}></i>${L('Wynik (zysk)', 'Result (profit)')}</span><span><i className="sw" style=${{ background: 'var(--bad)' }}></i>${L('Wynik (strata)', 'Result (loss)')}</span></div>
    <div className="svgwrap"><svg viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label=${L('Porównanie scenariuszy', 'Scenario comparison')}>
      ${yt.map(function (t) { return html`<g key=${t}><line x1=${m.l} x2=${W - m.r} y1=${y(t)} y2=${y(t)} stroke=${t === 0 ? 'var(--ink)' : 'var(--line)'} strokeWidth=${t === 0 ? 1.5 : 1} /><text x=${m.l - 8} y=${y(t)} textAnchor="end" dominantBaseline="middle" className="ax">${compact(t)}</text></g>`; })}
      ${rows.map(function (r, i) {
        var gx = m.l + i * gw + gw / 2;
        return html`<g key=${r.id}>
          ${series.map(function (s, j) {
            var v = s[0](r.c), x0 = gx + (j - 1.5) * (bw + 6) + 3;
            var col = s[1] || (v >= 0 ? 'var(--good)' : 'var(--bad)');
            var top = Math.min(y(v), y(0)), hgt = Math.max(Math.abs(y(v) - y(0)), 1);
            return html`<g key=${j}><rect x=${x0} y=${top} width=${bw} height=${hgt} rx="3" fill=${col} />
              ${j === 2 ? html`<text x=${x0 + bw / 2} y=${v >= 0 ? top - 6 : top + hgt + 14} textAnchor="middle" className="mk val">${compact(v)}</text>` : null}</g>`;
          })}
          <text x=${gx} y=${H - 14} textAnchor="middle" className="ax-t">${r.name}</text>
          ${r.c.planOver ? html`<text x=${gx} y=${H - 1} textAnchor="middle" className="mk warn">${L('poza możliwościami obsługi', 'beyond capacity')}</text>` : null}
        </g>`;
      })}
    </svg></div>
  </figure>`;
}

function summarySentences(c) {
  if (c.cm <= 0) return null;
  var s = [];

    s.push('At a price of ' + money(c.price) + ', each sale leaves you ' + money(c.cm) + ' to cover your fixed costs.');
    s.push('To cover your costs, you need ' + num(c.beClients) + ' ' + klientow(c.beClients) + ' per month (' + num(c.be) + ' ' + plural(c.be, c.F) + ').');
    s.push('To reach your target of ' + money(c.target) + ', you need ' + num(c.goalClients) + ' ' + klientow(c.goalClients) + ' (' + num(c.goalUnits) + ' ' + plural(c.goalUnits, c.F) + ').');
    if (c.capacity != null) {
      if (c.beOver) s.push('Warning: break-even alone is beyond what ' + teamNom(c) + ' can handle (' + num(c.capacity) + ' ' + plural(c.capacity, c.F) + ' per month).');
      else if (c.goalOver) s.push('Break-even is within reach, but your target is beyond what ' + teamNom(c) + ' can handle (' + num(c.capacity) + ' ' + plural(c.capacity, c.F) + ').');

    }

  }
  s.push('Przy cenie ' + money(c.price) + ' zostaje Ci ' + money(c.cm) + ' z każdej sprzedaży na pokrycie kosztów stałych.');
  s.push('Aby pokryć koszty, potrzebujesz ' + num(c.beClients) + ' ' + klientow(c.beClients) + ' miesięcznie (' + num(c.be) + ' ' + plural(c.be, c.F) + ').');
  s.push('Aby osiągnąć wybrany wynik ' + money(c.target) + ', potrzebujesz ' + num(c.goalClients) + ' ' + klientow(c.goalClients) + ' (' + num(c.goalUnits) + ' ' + plural(c.goalUnits, c.F) + ').');
  if (c.capacity != null) {
    if (c.beOver) s.push('Uwaga: już sam próg rentowności przekracza możliwości ' + teamGen(c) + ' (' + num(c.capacity) + ' ' + plural(c.capacity, c.F) + ' miesięcznie).');
    else if (c.goalOver) s.push('Próg rentowności jest w zasięgu, ale cel przekracza możliwości ' + teamGen(c) + ' (' + num(c.capacity) + ' ' + plural(c.capacity, c.F) + ').');
    else s.push(cap1(teamNom(c)) + ' obsłuży maksymalnie ' + num(c.capacity) + ' ' + plural(c.capacity, c.F) + ', więc cel mieści się w możliwościach obsługi.');
  }
  return s;
}

function CapacityBars(p) {
  var c = p.c;
  if (c.capacity == null) return html`<p className="hint">${L('Uzupełnij organizację pracy w etapie 3, aby porównać plan z możliwościami obsługi.', 'Fill in working time in step 3 to compare your plan with capacity.')}</p>`;
  var rows = [[L('Twój plan', 'Your plan'), c.units], [L('Próg rentowności', 'Break-even'), c.be], [L('Cel', 'Target'), c.goalUnits]].filter(function (r) { return r[1] != null; });
  var maxV = Math.max(c.capacity, Math.max.apply(null, rows.map(function (r) { return r[1]; })), 1);
  return html`<div className="capbars">
    ${rows.map(function (r) {
      var over = r[1] > c.capacity + EPS, w = r[1] / maxV * 100;
      return html`<div key=${r[0]} className="capbar">
        <span className="cb-l">${r[0]}</span>
        <div className="cb-track"><div className=${'cb-fill' + (over ? ' over' : '')} style=${{ width: w + '%' }}></div><div className="cb-cap" style=${{ left: (c.capacity / maxV * 100) + '%' }}></div></div>

      </div>`;
    })}
    <p className="small muted">${L('Pionowa kreska to limit: ', 'The vertical mark is the limit: ') + num(c.capacity) + ' ' + uLabel(c, c.capacity) + L(' miesięcznie (' + teamNom(c) + ').', ' per month (' + teamNom(c) + ').')}</p>
  </div>`;
}

function StageResults(p) {

  var head = html`<header className="stage-head"><p className="eyebrow">${L('Etap 4 z 5', 'Step 4 of 5')}</p><h2>${L('Rentowność', 'Profitability')}</h2>

  var sum = summarySentences(c);
  var pay = c.op <= 0 ? L('Brak zwrotu przy tych założeniach', 'No payback under these assumptions') : c.inv <= 0 ? L('Brak inwestycji', 'No investment') : num(c.payback, 1) + L(' mies.', ' months');

        : 'Koszt zmienny jednostki (' + money(c.unitVar) + ') jest ' + (c.cm === 0 ? 'równy cenie' : 'wyższy niż cena') + ' (' + money(c.price) + '). ' + (c.cm < 0 ? 'Na każdej sprzedaży tracisz ' + money(-c.cm) + '. ' : 'Z każdej sprzedaży nie zostaje nic na koszty stałe. ') + 'Więcej klientów nie pomoże: każda kolejna sprzedaż ' + (c.cm < 0 ? 'powiększa stratę' : 'nie zmniejsza straty') + ', a koszty stałe zostają niepokryte. Najpierw podnieś cenę albo obniż koszty zmienne.'}
    <//>` : null}

    <//>` : null}
    ${c.beOver && !c.planOver ? html`<${Notice} tone="warn" title=${L('Próg rentowności poza zasięgiem', 'Break-even out of reach')}>${LANG === 'en'
      ? 'Break-even needs ' + num(c.be) + ' ' + uLabel(c, c.be) + ', but ' + teamNom(c) + ' can handle ' + num(c.capacity) + '. Under these assumptions the business will not cover its costs.'
      : 'Do progu potrzeba ' + num(c.be) + ' ' + uLabel(c, c.be) + ', a ' + teamNom(c) + ' obsłuży ' + num(c.capacity) + '. Przy tych założeniach firma nie pokryje kosztów.'}<//>` : null}

    <div className="tiles">
      <${Tile} label=${L('Przychód miesięczny', 'Monthly revenue')} value=${money(c.revenue)} sub=${num(c.units, 1) + ' ' + uLabel(c, c.units) + ' × ' + money(c.price)} term="przychod" />
      <${Tile} label=${L('Koszty stałe', 'Fixed costs')} value=${money(c.fixedTotal)} sub=${L('co miesiąc, bez względu na sprzedaż', 'every month, whatever you sell')} term="staly" />
      <${Tile} label=${L('Koszty zmienne', 'Variable costs')} value=${money(c.varTotal)} sub=${money(c.unitVar) + L(' na jednostkę', ' per unit')} term="zmienny" />
      <${Tile} label=${L('Marża pokrycia', 'Contribution margin')} value=${money(c.cm)} sub=${L('na jednostce · ', 'per unit · ') + (c.price > 0 ? num(c.cm / c.price * 100) : 0) + L('% ceny', '% of price')} term="marza" tone=${c.cm <= 0 ? 'bad' : ''} />
      <${Tile} label=${L('Wynik operacyjny', 'Operating result')} value=${money(c.op)} sub=${c.planOver ? L('nieosiągalny przy obecnej przepustowości', 'not achievable at current capacity') : c.op >= 0 ? L('zysk przed podatkiem dochodowym', 'profit before income tax') : L('strata miesięczna', 'monthly loss')} term="zysk" tone=${c.planOver ? 'warn' : opTone} />
      <${Tile} label=${L('Klienci do progu rentowności', 'Customers to break even')} value=${c.beClients == null ? L('nieosiągalny', 'not achievable') : num(c.beClients)} sub=${c.be == null ? L('marża ≤ 0 zł', 'margin ≤ PLN 0') : num(c.be) + ' ' + uLabel(c, c.be)} term="prog" tone=${c.beOver ? 'warn' : ''} />
      <${Tile} label=${L('Klienci do celu', 'Customers to reach target')} value=${c.goalClients == null ? L('nieosiągalny', 'not achievable') : num(c.goalClients)} sub=${c.goalUnits == null ? L('marża ≤ 0 zł', 'margin ≤ PLN 0') : L('cel ', 'target ') + money(c.target) + ' · ' + num(c.goalUnits) + ' ' + uLabel(c, c.goalUnits)} tone=${c.goalOver ? 'warn' : ''} />
      <${Tile} label=${L('Średnio dziennie (' + c.F[2] + ')', 'Average per day (' + c.F[2] + ')')} value=${c.perDay == null ? '—' : num(c.perDay, 1)} sub=${c.bePerDay == null ? L('podaj dni pracy', 'enter working days') : L('do progu: ', 'to break even: ') + num(c.bePerDay, 1) + L(' dziennie', ' per day')} />
      <${Tile} label=${L('Wykorzystanie możliwości obsługi', 'Capacity used')} value=${utilText(c)} sub=${c.capacity == null ? L('uzupełnij organizację pracy', 'fill in working time') : num(c.units, 1) + L(' z ', ' of ') + num(c.capacity) + L(' możliwych', ' possible')} tone=${utilTone} />
      <${Tile} label=${L('Orientacyjny zwrot inwestycji', 'Approximate payback period')} value=${pay} sub=${c.op > 0 && c.inv > 0 ? money(c.inv) + ' ÷ ' + money(c.op) + L(' miesięcznie', ' per month') : null} tone=${c.op <= 0 ? 'bad' : ''} />
    </div>
    <p className="small muted">${L('Czas zwrotu to uproszczenie: zakłada, że co miesiąc masz ten sam wynik od pierwszego dnia, bez podatków i bez okresu rozruchu, kiedy klientów jest mniej.', 'The payback period is a simplification: it assumes the same result every month from day one, with no taxes and no start-up period when customers are fewer.')}${c.planOver ? L(' Ten plan przekracza możliwości obsługi, więc czas zwrotu też jest nierealny.', ' This plan exceeds capacity, so the payback period is unrealistic too.') : ''}</p>

    <div className="split">
      <div className="receipt" aria-label=${L('Podsumowanie prostym językiem', 'Plain-language summary')}>
        <p className="rc-h">${L('PODSUMOWANIE', 'SUMMARY')}</p>
        <p className="rc-sub">${p.st.idea.type || L('Twój biznes', 'Your business')} · ${L('miesiąc', 'month')}</p>
        <div className="rc-lines">
          <div><span>${L('Przychód', 'Revenue')}</span><span>${money(c.revenue)}</span></div>
          <div><span>${L('− koszty zmienne', '− variable costs')}</span><span>${money(c.varTotal)}</span></div>
          <div><span>${L('− koszty stałe', '− fixed costs')}</span><span>${money(c.fixedTotal)}</span></div>
          <div className="rc-tot"><span>${L('WYNIK', 'RESULT')}</span><span>${money(c.op)}</span></div>
        </div>
        ${sum ? html`<div className="rc-text">${sum.map(function (s, i) { return html`<p key=${i}>${s}</p>`; })}</div>` : html`<div className="rc-text"><p>${L('Przy cenie ' + money(c.price) + ' z żadnej sprzedaży nic nie zostaje na koszty stałe, więc firma nie osiągnie progu rentowności.', 'At a price of ' + money(c.price) + ' no sale leaves anything for fixed costs, so the business cannot break even.')}</p></div>`}
        <p className="rc-foot">${L('bez VAT · przed podatkiem dochodowym', 'excl. VAT · before income tax')}</p>
      </div>
      <div className="card">
        <div className="card-h"><h3>${L('Plan a możliwości obsługi', 'Plan vs. capacity')}</h3></div>
        <${CapacityBars} c=${c} />
